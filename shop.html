<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--swan); scroll-behavior:smooth; }
body{
  background:var(--swan);
  color:var(--ink);
  font-family:var(--f-sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
::selection{ background:var(--ink); color:#FFFFFF; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

.wrap{ max-width:var(--maxw, 1240px); margin:0 auto; padding:0 clamp(1.25rem,4vw,2.5rem); }

/* header */
header#hd{
  position:sticky; top:0; z-index:90;
  background:rgba(246,246,236,.88);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid var(--line);
  transition:all .3s ease;
}
.nav{ display:flex; align-items:center; justify-content:space-between; gap:2rem; height:74px; }
.logo{
  font-family:var(--f-sans); font-size:1.25rem; font-weight:800;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
}
.logo b{ color:var(--ink); font-weight:900; }
.nav-links{ display:flex; gap:2.2rem; align-items:center; }
.nav-links a{
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  color:var(--muted); padding:.4rem 0; position:relative; transition:color .2s;
}
.nav-links a:hover{ color:var(--ink); }
.nav-right{ display:flex; align-items:center; gap:1.2rem; }

.cart-btn{
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
  padding:.52rem 1.25rem; border-radius:999px; background:var(--ink);
  border:1px solid var(--ink); color:#FFFFFF; display:inline-flex; align-items:center; gap:.6rem;
  box-shadow:0 8px 20px -6px rgba(0,7,45,.3); transition:all .2s;
}
.cart-btn:hover{ background:var(--ink-soft); transform:translateY(-1px); }
.cart-btn .badge{
  background:#FFFFFF; color:var(--ink); border-radius:999px;
  padding:.1rem .45rem; font-size:.6rem; font-weight:700;
}
@media (max-width:880px){ .nav-links{ display:none; } }

.shop-head{ padding:clamp(2.5rem,5vw,4rem) 0 1.8rem; }
.shop-head h1{
  font-family:var(--f-sans); font-weight:800; letter-spacing:-.025em; line-height:1.08;
  font-size:clamp(2.4rem,5.5vw,3.8rem); color:var(--ink);
}
.shop-head h1 em{ font-style:italic; font-weight:300; }
.shop-head p{ color:var(--muted); margin-top:.8rem; max-width:32rem; font-size:1.02rem; }

/* search + sort bar */
.shop-tools{ display:flex; gap:1rem; flex-wrap:wrap; align-items:center; margin-top:2rem; }
.searchbox{
  position:relative; flex:1 1 240px; min-width:0; max-width:420px;
  display:flex; align-items:center;
  border:1px solid var(--line); border-radius:999px;
  background:rgba(255,255,255,.8); box-shadow:var(--sh-chip);
  transition:all .25s ease;
}
.searchbox:focus-within{
  border-color:var(--ink); background:#FFFFFF;
  box-shadow:0 8px 20px -6px rgba(0,7,45,.15);
}
.searchbox .si{ padding:0 .2rem 0 1.2rem; color:var(--muted); font-size:1.1rem; }
.searchbox input{
  flex:1; background:none; border:none; outline:none; color:var(--ink);
  font-family:var(--f-sans); font-size:.92rem; padding:.8rem .8rem;
}
.searchbox input::placeholder{ color:var(--muted); }
.searchbox button{
  border:none; background:none; color:var(--muted); cursor:pointer;
  padding:0 1.1rem; font-size:.85rem; transition:color .2s;
}
.searchbox button:hover{ color:var(--ink); }

.sortbox{ display:flex; align-items:center; gap:.7rem; }
.sortbox label{
  font-family:var(--f-mono); font-size:.62rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); font-weight:600;
}
.sortbox select{
  background:rgba(255,255,255,.8); color:var(--ink); cursor:pointer;
  border:1px solid var(--line); border-radius:999px;
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.08em; font-weight:600;
  padding:.75rem 1.4rem; outline:none; box-shadow:var(--sh-chip); transition:all .2s;
}
.sortbox select:hover, .sortbox select:focus{ border-color:var(--ink); background:#FFFFFF; }
.sortbox option{ background:#FFFFFF; color:var(--ink); }

/* category filter pills */
.filters{
  display:flex; gap:.6rem; flex-wrap:wrap; margin:1.8rem 0 2.5rem;
}
.fchip{
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  color:var(--muted); border:1px solid var(--line); background:rgba(255,255,255,.7);
  padding:.65em 1.25em; border-radius:999px; box-shadow:var(--sh-chip);
  transition:all .2s ease; cursor:pointer;
}
.fchip:hover{ border-color:var(--ink); color:var(--ink); background:#FFFFFF; }
.fchip.on{
  background:var(--ink); border-color:var(--ink); color:#FFFFFF; font-weight:700;
  box-shadow:0 6px 16px -4px rgba(0,7,45,.3);
}
.fchip .n{ opacity:.7; margin-left:.45em; font-size:.85em; }

.shop-grid-zone{ padding-bottom:clamp(4rem,8vw,6rem); }
.count-line{
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin:0 0 1.8rem .2rem; font-weight:500;
}
.count-line b{ color:var(--ink); font-weight:700; }

.empty{
  text-align:center; padding:5rem 1.5rem; color:var(--muted); font-family:var(--f-mono);
  font-size:.75rem; letter-spacing:.16em; text-transform:uppercase;
  background:rgba(255,255,255,.6); border:1px dashed var(--line); border-radius:18px;
}

footer{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:3.5rem 0 2.5rem;
  margin-top:3rem;
}
.foot{
  display:flex; justify-content:space-between; align-items:center; gap:1.5rem; flex-wrap:wrap;
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.foot a{ color:var(--muted); transition:color .2s; }
.foot a:hover{ color:var(--ink); }
.foot .links{ display:flex; gap:1.8rem; flex-wrap:wrap; }
</style>

<body>

<header id="hd">
  <div class="wrap nav">
    <a href="index.html" class="logo">THE AIM<b>.</b></a>
    <nav class="nav-links" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="shop.html">All Products</a>
    </nav>
    <div class="nav-right">
      <span data-account></span>
      <button class="cart-btn" data-cart-open aria-label="Open cart">Bag<span class="badge" data-cart-count>0</span></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap shop-head">
    <h1>All <em>products.</em></h1>
    <div class="shop-tools">
      <div class="searchbox">
        <span class="si" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Search products…" aria-label="Search products" autocomplete="off" />
        <button id="searchClear" aria-label="Clear search" hidden>✕</button>
      </div>
      <div class="sortbox">
        <label for="sortSelect">Sort</label>
        <select id="sortSelect" aria-label="Sort products">
          <option value="default">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
    </div>
    <div class="filters" id="filters" role="tablist" aria-label="Filter by category"></div>
  </div>

  <div class="wrap shop-grid-zone">
    <p class="count-line" id="countLine"></p>
    <div class="grid" id="shopGrid" data-plaque="All Products"></div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span>© 2026 The AIM</span>
    <span class="links">
      <a href="index.html">Home</a>
      <a href="account.html">My account</a>
<a href="track.html">Track order</a>
<a href="watchlist.html">Watchlist</a>
<a href="contact.html">Contact</a>
      <a href="shipping.html">Shipping</a>
      <a href="returns.html">Returns</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="curator.html">Curators</a>
    </span>
    <span>Ships across India</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script src="js/products-data.js"></script>
<script src="js/live-products.js"></script>
<script src="js/shelf.js"></script>
<script>
(function(){
  var grid = document.getElementById('shopGrid');
  var countLine = document.getElementById('countLine');
  var filtersEl = document.getElementById('filters');

  /* build category counts */
  var cats = {};
  PRODUCTS.forEach(function(p){ cats[p.category] = (cats[p.category]||0) + 1; });
  var catNames = Object.keys(cats).sort();

  /* plaque names per category — the niche label changes with the filter */
  var PLAQUES = {
    'All':'All Products',
    'Room':'Room',
    'Desk':'Desk',
    'Gadgets':'Gadgets',
    'Storage':'Storage',
    'Daily Essentials':'Daily Essentials'
  };

  var current = 'All';
  var param = new URLSearchParams(location.search).get('category');
  if(param && cats[param]) current = param;

  function chipHTML(name, n){
    return '<button class="fchip'+(name===current?' on':'')+'" data-cat="'+name+'" role="tab" ' +
           'aria-selected="'+(name===current)+'">'+name+'<span class="n">'+n+'</span></button>';
  }

  function renderFilters(){
    filtersEl.innerHTML =
      chipHTML('All', PRODUCTS.length) +
      catNames.map(function(c){ return chipHTML(c, cats[c]); }).join('');
    Array.prototype.forEach.call(filtersEl.children, function(btn){
      btn.addEventListener('click', function(){
        current = btn.dataset.cat;
        var url = new URL(location.href);
        if(current === 'All') url.searchParams.delete('category');
        else url.searchParams.set('category', current);
        history.replaceState(null, '', url);
        renderFilters(); renderGrid();
      });
    });
  }

  var query = '', sortBy = 'default';

  function renderGrid(){
    var items = current === 'All'
      ? PRODUCTS.slice()
      : PRODUCTS.filter(function(p){ return p.category === current; });

    if(query){
      var q = query.toLowerCase();
      items = items.filter(function(p){
        return (p.name + ' ' + p.category + ' ' + (p.desc||'')).toLowerCase().indexOf(q) > -1;
      });
    }
    if(sortBy === 'price-asc')  items.sort(function(a,b){ return a.price - b.price; });
    if(sortBy === 'price-desc') items.sort(function(a,b){ return b.price - a.price; });
    if(sortBy === 'name')       items.sort(function(a,b){ return a.name.localeCompare(b.name); });
    grid.setAttribute('data-plaque', PLAQUES[current] || current);
    if(!items.length){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">' +
        (query ? 'No products match “' + query + '”.' : 'Nothing here right now.') + '</div>';
    } else {
      grid.innerHTML = items.map(shelfCard).join('');
    }
    countLine.innerHTML = 'Showing <b>' + items.length + '</b> of ' + PRODUCTS.length + ' products' +
      (current !== 'All' ? ' · ' + current : '') +
      (query ? ' · “' + query + '”' : '');
  }

  var si = document.getElementById('searchInput');
  var sc = document.getElementById('searchClear');
  var t;
  si.addEventListener('input', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      query = si.value.trim();
      sc.hidden = !query;
      renderGrid();
    }, 160);
  });
  sc.addEventListener('click', function(){
    si.value = ''; query = ''; sc.hidden = true; renderGrid(); si.focus();
  });
  document.getElementById('sortSelect').addEventListener('change', function(e){
    sortBy = e.target.value; renderGrid();
  });

  renderFilters();
  renderGrid();

  /* live-products.js merges database prices in asynchronously and then
     fires this. Without listening, the grid keeps showing the static
     price it rendered a moment earlier. */
  document.addEventListener('products:updated', function(){
    cats = {};
    PRODUCTS.forEach(function(p){ cats[p.category] = (cats[p.category]||0) + 1; });
    catNames = Object.keys(cats).sort();
    renderFilters(); renderGrid();
  });
})();
</script>
