<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta name="twitter:description" content="Useful everyday items at honest prices.">

<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--swan); scroll-behavior:smooth; }
body{
  background:var(--swan);
  color:var(--ink);
  font-family:var(--f-sans);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
::selection{ background:var(--ink); color:#FFFFFF; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

.wrap{ max-width:1200px; margin:0 auto; padding:0 clamp(1.25rem,4vw,2.5rem); }
#page{
  max-width:580px; margin:0 auto;
  display:flex; flex-direction:column; gap:1.1rem;
  padding:clamp(1.5rem,3vw,2.5rem) 1rem 4rem;
}
@media (max-width:640px){
  #page{
    max-width:440px;
    margin:0 auto;
    padding:1.2rem 1.25rem 5rem;
  }
}

/* frosted glass card module */
.prod-card{
  position:relative;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;
  padding:clamp(1.2rem, 3vw, 1.6rem);
  box-shadow:0 12px 36px -12px rgba(0,7,45,.1), inset 0 1px 0 #FFFFFF;
}

/* header */
header{
  position:sticky; top:0; z-index:50;
  transition:all .3s ease;
}
.nav{
  max-width:1240px; margin:0 auto; padding:0 clamp(1.25rem,4vw,2.5rem);
  display:flex; align-items:center; justify-content:space-between; height:72px;
}
.logo{
  font-family:var(--f-sans); font-size:1.2rem; font-weight:800; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink);
}
.logo b{ color:var(--ink); font-weight:900; }
.back{
  font-family:var(--f-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); transition:color .2s; font-weight:600;
}
.back:hover{ color:var(--ink); }
.nav-right{ display:flex; align-items:center; gap:1.4rem; }

/* ── viewer ── */
.viewer-wrap{
  display:flex; flex-direction:column; gap:.75rem;
}

.photo{
  position:relative; aspect-ratio:1/1; overflow:hidden;
  border-radius:32px; background:#FFFFFF; cursor:zoom-in;
  box-shadow:0 20px 48px -12px rgba(0,7,45,.22), inset 0 1px 1px rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.6);
}
.photo img{ width:100%; height:100%; object-fit:cover; transition:opacity .3s ease; }
.photo img.fading{ opacity:0; }

.chip{
  position:absolute; z-index:5;
  font-family:var(--f-mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
  font-weight:600; background:rgba(0,7,45,.5); color:#FFFFFF;
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.25); padding:.4em .9em; border-radius:999px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  transition:all .2s;
}
.chip:hover{ background:rgba(0,7,45,.75); }
#counter{ top:14px; left:14px; }
#mainBtn{ bottom:14px; left:14px; display:none; }
.watch-chip{ bottom:14px; right:14px; cursor:pointer; }

/* video stage */
.video-stage{
  position:absolute; inset:0; z-index:4; background:#000;
  display:none; border-radius:inherit; overflow:hidden;
}
.video-stage.on{ display:block; }
.video-stage iframe, .video-stage video{ width:100%; height:100%; object-fit:cover; }

/* gallery nav buttons */
.pnav{
  position:absolute; top:50%; transform:translateY(-50%); z-index:4;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,.88); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.9);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); color:var(--ink); font-size:.95rem; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,7,45,.15); transition:all .2s;
}
.pnav:hover{ background:#FFFFFF; border-color:var(--ink); transform:translateY(-50%) scale(1.08); }
.pnav.pv{ left:12px; } .pnav.nx{ right:12px; }

/* thumbnails */
.thumbs{
  display:flex; gap:.65rem; overflow-x:auto; padding:2px 2px 6px;
  scrollbar-width:none;
}
.thumbs::-webkit-scrollbar{ display:none; }
.thumb{
  flex:0 0 66px; height:66px; border-radius:18px; overflow:hidden;
  border:2px solid transparent; background:#FFFFFF; position:relative;
  opacity:.7; transition:all .2s ease; cursor:pointer;
  box-shadow:0 4px 12px rgba(0,7,45,.08); padding:0;
}
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.thumb:hover{ opacity:1; transform:translateY(-2px); }
.thumb.on{
  opacity:1; border-color:var(--ink);
  box-shadow:0 0 0 2px var(--ink), 0 8px 18px rgba(0,7,45,.2);
  transform:scale(1.04);
}
.thumb .tn{
  position:absolute; bottom:3px; right:3px;
  font-family:var(--f-mono); font-size:.45rem; letter-spacing:.08em;
  color:#FFFFFF; background:rgba(0,7,45,.65); padding:1px 4px; border-radius:4px;
  font-weight:700;
}
.thumb-video{ position:relative; }
.thumb-video .vplay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:1rem; color:#FFFFFF; background:rgba(0,7,45,.45);
}
.thumb-video:hover .vplay{ background:rgba(0,7,45,.3); }

/* ── INFO CARD ── */
.seller-row{
  display:flex; align-items:center; gap:.5rem; font-family:var(--f-mono);
  font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600;
}
.vchk{
  display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px;
  border-radius:50%; background:var(--cobalt); color:#FFFFFF; font-size:9px; font-weight:700;
}
.info-card h1{
  font-family:var(--f-sans); font-weight:800;
  font-size:clamp(1.45rem,3.4vw,1.85rem); line-height:1.25;
  letter-spacing:-.02em; color:var(--ink); margin:.4rem 0 .6rem;
}
.price-callout{
  display:flex; align-items:flex-start; gap:.85rem;
  border-left:3.5px solid var(--ink); padding-left:.85rem; margin:.5rem 0 .7rem;
}
.price-main{
  font-family:var(--f-mono); font-weight:700; line-height:1;
  font-size:clamp(1.75rem,3.8vw,2.2rem); color:var(--ink);
}
.price-sub{
  font-size:.74rem; color:var(--muted); line-height:1.35; padding-top:2px;
}
.price-sub b{ color:var(--live); font-weight:600; }
.stockline{
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.08em;
  text-transform:uppercase; margin:0; font-weight:600; color:var(--live);
  display:flex; align-items:center; gap:.4rem;
}

.crumb{
  display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin:0;
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); font-weight:500;
}
.crumb a{ color:var(--muted); transition:color .2s; }
.crumb a:hover{ color:var(--ink); }
.crumb b{ color:var(--ink); font-weight:600; }

.idblock{ display:flex; flex-direction:column; gap:.6rem; }
.seller{
  font-family:var(--f-mono); font-size:.62rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--muted); font-weight:600;
}
.skurow{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
.sku{
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted);
}
.info h1{
  font-family:var(--f-sans); font-weight:800;
  font-size:clamp(1.75rem,3.8vw,2.35rem); line-height:1.2;
  letter-spacing:-.02em; color:var(--ink); margin:.1rem 0 0;
}
.tagline{ color:var(--muted); font-size:.95rem; margin:0; line-height:1.5; }

/* price accent box */
.pricebox{
  display:flex; flex-direction:column; gap:.35rem; margin:0;
  border-left:3px solid var(--ink); padding-left:1rem;
}
.price-row{ display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap; }
.price-main{
  font-family:var(--f-mono); font-weight:700; line-height:1.1;
  font-size:clamp(1.8rem,4vw,2.3rem); color:var(--ink);
}
.price-meta{ font-family:var(--f-mono); font-size:.74rem; color:var(--muted); }
.price-meta s{ color:#8E96B8; }
.price-meta b{ color:var(--live); font-weight:700; margin-left:.3em; }
.price-sub{ font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; }
.price-sub i{ color:var(--live); font-style:normal; font-weight:700; }

.stockline{
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.1em;
  text-transform:uppercase; margin:0; font-weight:600;
}
.stockline.ok{ color:var(--live); }
.stockline.low{ color:#C2410C; }
.stockline.out{ color:#E08A7A; }

.desc{ color:var(--muted); line-height:1.75; font-size:.92rem; margin:0; }

/* details accordion */
.details-toggle{
  display:inline-flex; align-items:center; gap:.6em; width:auto; cursor:pointer;
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink); font-weight:600;
  background:none; border:none; border-bottom:1.5px solid var(--ink);
  padding:0 0 .35em; transition:opacity .2s;
}
.details-toggle:hover{ opacity:.7; }
.details{
  display:none; width:100%; margin-top:-.4rem;
  border:1px solid var(--line); border-radius:14px;
  background:rgba(255,255,255,.8); padding:.6rem 1.2rem;
}
.details.open{ display:block; }
.details div{
  display:flex; justify-content:space-between; gap:1rem;
  padding:.65rem 0; border-bottom:1px solid var(--line); font-size:.86rem;
}
.details div:last-child{ border-bottom:none; }
.details b{
  font-family:var(--f-mono); font-weight:500; font-size:.62rem;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.details span{ color:var(--ink); font-weight:500; }

/* action controls */
.actions{
  display:flex; gap:.8rem; align-items:stretch; flex-wrap:wrap; margin:.3rem 0 0;
}
.qty{
  display:flex; align-items:center; flex:none; overflow:hidden;
  border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.9);
}
.qty button{
  width:44px; height:52px; font-size:1.1rem; color:var(--ink);
  transition:background .2s; display:flex; align-items:center; justify-content:center;
}
.qty button:hover{ background:rgba(0,7,45,.06); }
.qty .q{ width:32px; text-align:center; font-family:var(--f-mono); font-weight:700; color:var(--ink); }

.buy{
  flex:1 1 180px; min-height:52px; border-radius:999px; padding:0 1.6rem;
  background:var(--ink); color:#FFFFFF; border:1px solid var(--ink);
  font-family:var(--f-mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase;
  font-weight:700; cursor:pointer; transition:all .25s ease;
  box-shadow:0 12px 24px -8px rgba(0,7,45,.35);
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
}
.buy:hover{
  background:var(--ink-soft); border-color:var(--ink-soft);
  transform:translateY(-2px); box-shadow:0 16px 32px -10px rgba(0,7,45,.45);
}
.cart{
  flex:1 1 140px; min-height:52px; border-radius:999px; padding:0 1.4rem;
  background:rgba(255,255,255,.8); color:var(--ink); border:1px solid var(--line);
  font-family:var(--f-mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase;
  font-weight:700; cursor:pointer; transition:all .25s ease;
  box-shadow:var(--sh-chip);
  display:inline-flex; align-items:center; justify-content:center;
}
.cart:hover{
  background:#FFFFFF; border-color:var(--ink); transform:translateY(-2px);
}

.trust{
  list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:.8rem;
  padding-top:1.2rem; border-top:1px solid var(--line); margin-top:.5rem;
}
@media (max-width:540px){ .trust{ grid-template-columns:1fr; } }
.trust li{
  display:flex; align-items:center; gap:.6rem;
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.04em; color:var(--muted);
}
.trust .ti{ color:var(--live); font-weight:700; font-size:.8rem; }

/* sticky buy bar */
.buybar{
  position:fixed; left:0; right:0; bottom:0; z-index:80;
  background:rgba(246,246,236,.96); backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-top:1px solid var(--line);
  padding:.8rem clamp(1.25rem,4vw,2.5rem);
  display:none; align-items:center; justify-content:space-between; gap:1.2rem;
  transform:translateY(110%); transition:transform .3s ease;
  box-shadow:0 -8px 24px rgba(0,7,45,.08);
  padding-bottom:calc(.8rem + env(safe-area-inset-bottom));
}
.buybar.on{ transform:none; }
.bb-info{ display:flex; flex-direction:column; flex:1; min-width:0; }
.bb-name{ font-family:var(--f-sans); font-weight:700; font-size:.86rem; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bb-price{ font-family:var(--f-mono); font-weight:700; font-size:.95rem; color:var(--ink); }
.bb-btn{
  background:var(--ink); color:#FFFFFF; padding:.75rem 1.6rem; border-radius:999px;
  font-family:var(--f-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap;
}
.bb-btn:hover{ background:var(--ink-soft); }

@media (max-width:820px){
  .buybar{ display:flex; }
  body{ padding-bottom:5rem; }
}

/* zoom lightbox */
#lb{
  position:fixed; inset:0; z-index:9999;
  background:rgba(0,7,45,.88); backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
  padding:2rem;
}
#lb.open{ opacity:1; pointer-events:auto; }
#lbImg{ max-width:92vw; max-height:88vh; object-fit:contain; border-radius:16px; }
#lbClose{
  position:absolute; top:1.5rem; right:1.5rem; width:44px; height:44px;
  border-radius:50%; background:rgba(255,255,255,.9); color:var(--ink);
  font-size:1.2rem; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .2s; border:1px solid var(--line);
}
#lbClose:hover{ background:#FFFFFF; transform:scale(1.1); }

/* related */
.related-zone{ padding:clamp(3rem,6vw,5rem) 0; }
.rwrap{ max-width:1200px; margin:0 auto; padding:0 clamp(1.25rem,4vw,2.5rem); }
.rhead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:1.6rem; }
.rhead h2{ font-family:var(--f-sans); font-weight:800; font-size:clamp(1.4rem,3vw,1.8rem); color:var(--ink); }
.rhead a{ font-family:var(--f-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.rhead a:hover{ color:var(--ink); }

/* not found */
.nf{ padding:5rem 1rem; text-align:center; }
.nf h1{ font-size:2rem; font-weight:800; color:var(--ink); }
</style>
</head>

<script>
(function(){
  var id = new URLSearchParams(location.search).get('id');
  var p  = PRODUCTS.find(function(x){ return x.id === id; }) || null;
  var page = document.getElementById('page');

  if(!p){
    page.innerHTML = '<div class="nf"><h1>Product not found.</h1>' +
      '<p style="color:var(--muted);margin-top:1rem">It may no longer be available.</p>' +
      '<p style="margin-top:2rem"><a href="index.html" class="details-toggle">← Back home</a></p></div>';
    return;
  }

  document.title = p.name + ' — The AIM';
  (function(){
    var base = location.href.split('#')[0];
    var img  = new URL(p.hero, location.href).href;
    var set = function(sel, val){
      var el = document.querySelector(sel); if(el) el.setAttribute('content', val);
    };
    set('meta[property="og:title"]', p.name + ' — The AIM');
    set('meta[property="og:description"]', p.desc);
    set('meta[property="og:image"]', img);
    set('meta[property="og:url"]', base);
    set('meta[name="twitter:title"]', p.name + ' — The AIM');
    set('meta[name="twitter:description"]', p.desc);
    set('meta[name="twitter:image"]', img);
    var can = document.querySelector('link[rel="canonical"]'); if(can) can.href = base;
    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"Product",
      "name":p.name,"image":[img],"description":p.desc,"sku":p.sku,
      "brand":{"@type":"Brand","name":"The AIM"},
      "offers":{"@type":"Offer","url":base,"priceCurrency":"INR",
                "price":p.price,"availability":"https://schema.org/InStock"}
    });
    document.head.appendChild(ld);
  })();
  var fmt = function(n){ return '₹' + n.toLocaleString('en-IN'); };

  var hasVideo = !!p.video;

  var thumbsHtml = p.gallery.map(function(src,i){
    var label = i===0 ? 'HERO' : String(i).padStart(2,'0');
    return '<button class="thumb'+(i===0?' on':'')+'" data-i="'+i+'" aria-label="Photo '+(i+1)+'">' +
           '<img src="'+src.replace(/\.webp$/, '.thumb.webp')+'" alt="" loading="lazy" /><span class="tn">'+label+'</span></button>';
  }).join('');

  // video sits as the FIRST thumbnail (photo still shows first in the viewer)
  var videoThumb = hasVideo
    ? '<button class="thumb thumb-video" data-video aria-label="Play product video">' +
        '<img src="'+p.gallery[0].replace(/\.webp$/, '.thumb.webp')+'" alt="" loading="lazy" />' +
        '<span class="vplay">▶</span><span class="tn">VIDEO</span>' +
      '</button>'
    : '';

  var badgeText = p.badge || (p.isNew ? 'New' : '');
  var offPct = (p.mrp && p.mrp > p.price) ? Math.round((1 - p.price / p.mrp) * 100) : 0;

  page.innerHTML =
  /* CARD 1: MEDIA ICON BOX */
  '<div class="viewer-wrap">' +
    '<div class="photo" id="photo">' +
      '<span class="chip" id="counter">1 / '+p.gallery.length+'</span>' +
      '<img id="mainImg" src="'+p.gallery[0]+'" alt="'+p.name+'" />' +
      '<div class="video-stage" id="videoStage"></div>' +
      '<button class="pnav pv" id="pv" aria-label="Previous photo">←</button>' +
      '<button class="pnav nx" id="nx" aria-label="Next photo">→</button>' +
      '<button class="chip" id="mainBtn">← Main photo</button>' +
      (hasVideo ? '<button class="chip watch-chip" id="watchChip">▶ Watch video</button>' : '') +
    '</div>' +
    '<div class="thumbs" id="thumbs">'+videoThumb+thumbsHtml+'</div>' +
  '</div>' +

  /* CARD 2: INFO PANEL */
  '<div class="prod-card info-card">' +
    '<div class="seller-row">' +
      '<span>The AIM</span><span class="vchk">✓</span>' +
      '<span>·</span>' +
      (p.sku ? '<span>SKU '+p.sku+'</span>' : '<span>Verified</span>') +
      (badgeText ? '<span class="badge" style="margin-left:auto">'+badgeText+'</span>' : '') +
    '</div>' +
    '<h1>'+p.name+'</h1>' +
    '<div class="price-callout">' +
      '<div class="price-main">'+fmt(p.price)+'</div>' +
      '<div class="price-sub">' +
        '<div><b>✓ Inclusive of all taxes</b></div>' +
        '<div>Free delivery across India</div>' +
      '</div>' +
    '</div>' +
    '<div class="stockline ok" id="stockline">✓ In stock · ships in 1–2 days</div>' +
  '</div>' +

  /* CARD 3: DESCRIPTION */
  '<div class="prod-card desc-card">' +
    '<p class="desc" style="color:var(--ink);font-size:.88rem;line-height:1.65;margin:0">'+p.desc+'</p>' +
  '</div>' +

  /* CARD 4: DETAILS ACCORDION */
  '<div class="prod-card details-card" style="padding:0 !important;overflow:hidden">' +
    '<button class="details-toggle-btn" id="dt" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:700;cursor:pointer;background:none;border:none">' +
      '<span>Full details</span>' +
      '<span class="chev" style="transition:transform .25s">▼</span>' +
    '</button>' +
    '<div class="details" id="dd" style="display:none;padding:0 1.4rem 1.2rem;border-top:1px solid var(--line-soft)">' +
      '<div style="display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft);font-size:.84rem"><b style="font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Category</b><span>'+p.category+'</span></div>' +
      (p.sku ? '<div style="display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft);font-size:.84rem"><b style="font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Product code</b><span>'+p.sku+'</span></div>' : '') +
      (p.stock != null ? '<div style="display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft);font-size:.84rem"><b style="font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Availability</b><span>'+(p.stock>0?'In stock':'Sold out')+'</span></div>' : '') +
      '<div style="display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft);font-size:.84rem"><b style="font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Delivery</b><span>1–2 days, pan-India</span></div>' +
      '<div style="display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;font-size:.84rem"><b style="font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Returns</b><span>7 days · damaged or faulty</span></div>' +
    '</div>' +
  '</div>' +

  /* CARD 5: ACTIONS & TRUST */
  '<div style="display:flex;flex-direction:column;gap:1rem">' +
    '<div class="actions">' +
      '<div class="qty">' +
        '<button id="minus" aria-label="Decrease quantity">−</button>' +
        '<span class="q" id="q">1</span>' +
        '<button id="plus" aria-label="Increase quantity">+</button>' +
      '</div>' +
      '<button class="buy" id="buyBtn">Buy now</button>' +
      '<button class="cart" id="cartBtn">Add to bag</button>' +
    '</div>' +
    '<ul class="trust">' +
      '<li><span class="ti">\u25C8</span>Hand-picked item</li>' +
      '<li><span class="ti">\u25B6</span>Filmed in real life</li>' +
      '<li><span class="ti">\u21C4</span>7-day easy returns</li>' +
      '<li><span class="ti">\u2691</span>Ships pan-India, tracked</li>' +
    '</ul>' +
  '</div>' +

  '<div class="buybar" id="buybar">' +
    '<div class="bb-info"><span class="bb-name">'+p.name+'</span><span class="bb-price">'+fmt(p.price)+'</span></div>' +
    '<button class="bb-btn" id="bbBuy">Buy now</button>' +
  '</div>';

  /* stock line — honest, from live data when present */
  (function(){
    var el = document.getElementById('stockline');
    if(!el) return;
    var st = p.stock;
    if(st == null){ el.textContent = 'In stock · ships in 1–2 days'; el.className = 'stockline ok'; }
    else if(st <= 0){ el.textContent = 'Sold out'; el.className = 'stockline out'; }
    else if(st <= 5){ el.textContent = 'Only ' + st + ' left'; el.className = 'stockline low'; }
    else { el.textContent = 'In stock · ships in 1–2 days'; el.className = 'stockline ok'; }
  })();

  /* sticky buy bar appears once the main buttons scroll away */
  (function(){
    var bar = document.getElementById('buybar');
    var acts = document.querySelector('.actions');
    var bb = document.getElementById('bbBuy');
    if(!bar || !acts) return;
    if(bb) bb.addEventListener('click', function(){ document.getElementById('buyBtn').click(); });
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(en){
        bar.classList.toggle('on', !en[0].isIntersecting);
      }, { threshold:0 }).observe(acts);
    }
  })();

  /* gallery logic — hero is index 0, numbered photos follow */
  var idx = 0;
  var img = document.getElementById('mainImg');
  var counter = document.getElementById('counter');
  var mainBtn = document.getElementById('mainBtn');
  var stage = document.getElementById('videoStage');
  var videoOn = false;
  var thumbs = Array.prototype.slice.call(document.querySelectorAll('.thumb:not(.thumb-video)'));
  var videoThumbBtn = document.querySelector('.thumb-video');

  function closeVideo(){
    videoOn = false;
    stage.innerHTML = '';                    // stop playback
    stage.classList.remove('on');
    if(videoThumbBtn) videoThumbBtn.classList.remove('on');
  }
  function openVideo(){
    if(!hasVideo) return;
    videoOn = true;
    stage.innerHTML = AscentraVideo.embedHTML(p.video);
    stage.classList.add('on');
    counter.textContent = 'VIDEO';
    mainBtn.style.display = 'inline-flex';   // "← Main photo" returns from video
    thumbs.forEach(function(t){ t.classList.remove('on'); });
    if(videoThumbBtn) videoThumbBtn.classList.add('on');
  }

  function show(i){
    closeVideo();
    idx = (i + p.gallery.length) % p.gallery.length;
    img.classList.add('fading');
    setTimeout(function(){
      img.src = p.gallery[idx];
      img.classList.remove('fading');
    }, 180);
    thumbs.forEach(function(t,k){ t.classList.toggle('on', k===idx); });
    counter.textContent = (idx+1) + ' / ' + p.gallery.length;
    mainBtn.style.display = idx === 0 ? 'none' : 'inline-flex';
  }
  thumbs.forEach(function(t){
    t.addEventListener('click', function(){ show(parseInt(t.dataset.i,10)); });
  });
  if(videoThumbBtn) videoThumbBtn.addEventListener('click', openVideo);
  var watchChip = document.getElementById('watchChip');
  if(watchChip) watchChip.addEventListener('click', function(e){ e.stopPropagation(); openVideo(); });
  document.getElementById('pv').addEventListener('click', function(e){ e.stopPropagation(); show(idx-1); });
  document.getElementById('nx').addEventListener('click', function(e){ e.stopPropagation(); show(idx+1); });
  mainBtn.addEventListener('click', function(e){ e.stopPropagation(); show(0); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowLeft') show(idx-1);
    if(e.key==='ArrowRight') show(idx+1);
    if(e.key==='Escape'){ if(videoOn) show(idx); lb.classList.remove('open'); }
  });

  /* zoom lightbox — only for photos, never while a video is playing */
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  document.getElementById('photo').addEventListener('click', function(e){
    if(videoOn) return;                       // don't hijack video controls
    if(e.target.closest('.pnav, .chip')) return;
    lbImg.src = p.gallery[idx];
    lb.classList.add('open');
  });
  document.getElementById('lbClose').addEventListener('click', function(){ lb.classList.remove('open'); });
  lb.addEventListener('click', function(e){ if(e.target===lb) lb.classList.remove('open'); });

  /* details toggle */
  var dt = document.getElementById('dt'), dd = document.getElementById('dd');
  dt.addEventListener('click', function(){
    var open = dd.style.display === 'block';
    dd.style.display = open ? 'none' : 'block';
    dt.classList.toggle('open', !open);
    var ch = dt.querySelector('.chev');
    if(ch) ch.style.transform = open ? 'none' : 'rotate(180deg)';
  });

  /* quantity */
  var q = 1, qEl = document.getElementById('q');
  document.getElementById('plus').addEventListener('click', function(){ q = Math.min(q+1, 10); qEl.textContent = q; });
  document.getElementById('minus').addEventListener('click', function(){ q = Math.max(q-1, 1); qEl.textContent = q; });

  /* related shelf — same category first, then the rest of the drop */
  (function(){
    var same = PRODUCTS.filter(function(x){ return x.id !== p.id && x.category === p.category; });
    var rest = PRODUCTS.filter(function(x){ return x.id !== p.id && x.category !== p.category; });
    var picks = same.concat(rest).slice(0, 4);
    if(picks.length){
      document.getElementById('related').innerHTML = picks.map(shelfCard).join('');
      document.getElementById('relatedZone').hidden = false;
    }
  })();

  /* buy / cart — hook these into your existing checkout (main.js) */
  document.getElementById('buyBtn').addEventListener('click', function(){
    if(window.buyNow) window.buyNow(p, q);
  });
  document.getElementById('cartBtn').addEventListener('click', function(){
    if(window.addToCart) window.addToCart(p, q);
  });
})();
</script>
<script src="js/ambient.js"></script>
<script src="js/account.js"></script>
<script src="js/support.js"></script>
<script src="js/cube.js" defer></script>
</body>
</html>
