<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Checkout — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#071320">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071320; --ink-2:#0C1E30; --ink-3:#16161a;
  --line-1:#204264; --line-soft:#16293D;
  --text:#F4ECDC; --muted:#9FB3C7; --faint:#64809B;
  --gold:#4FA8FF; --gold-hi:#8FCBFF; --live:#6aa88f; --err:#e0866a;
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"Space Grotesk",system-ui,sans-serif;
  --f-mono:"Space Mono",monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:radial-gradient(1400px 900px at 50% -25%, #0E2135, var(--ink) 62%) fixed;
  color:var(--text); font-family:var(--f-body); line-height:1.6; -webkit-font-smoothing:antialiased;
}
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; cursor:pointer; }
::selection{ background:var(--gold); color:var(--ink); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

header{ border-bottom:1px solid var(--line-soft); }
.nav{ max-width:1100px; margin:0 auto; padding:0 1.4rem; height:72px; display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:var(--f-display); font-size:1.15rem; letter-spacing:.3em; text-transform:uppercase; }
.logo b{ color:var(--gold); font-weight:400; }
.secure{ font-family:var(--f-mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:.5em; }
.secure::before{ content:"🔒"; font-size:.8em; }

.wrap{ max-width:1100px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) 1.4rem 5rem; }
h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(1.8rem,4vw,2.6rem); letter-spacing:-.01em; margin-bottom:2rem; }

.checkout-grid{ display:grid; grid-template-columns:1.3fr .9fr; gap:clamp(2rem,4vw,3.5rem); align-items:start; }
@media (max-width:820px){ .checkout-grid{ grid-template-columns:1fr; } .summary{ order:-1; } }

/* form */
.step-label{ font-family:var(--f-mono); font-size:.62rem; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-bottom:1.1rem; display:flex; align-items:center; gap:.7em; }
.step-label .num{ width:22px; height:22px; border-radius:50%; border:1px solid var(--gold); display:inline-flex; align-items:center; justify-content:center; font-size:.7rem; }
.field{ margin-bottom:1.1rem; }
.field.row2{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.1rem; }
label{ display:block; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.45rem; }
input, textarea, select{
  width:100%; background:var(--ink-2); border:1px solid var(--line-1); border-radius:9px;
  color:var(--text); font-family:var(--f-body); font-size:.92rem; padding:.85rem 1rem; outline:none;
  transition:border-color .3s;
}
input:focus, textarea:focus, select:focus{ border-color:var(--gold); }
input::placeholder, textarea::placeholder{ color:var(--faint); }
input.bad, textarea.bad{ border-color:var(--err); }
.hint{ font-size:.72rem; color:var(--err); margin-top:.35rem; display:none; }
.hint.show{ display:block; }
textarea{ resize:vertical; min-height:70px; }

.pay-methods{ display:flex; flex-direction:column; gap:.7rem; margin-top:.4rem; }
.pay-opt{
  display:flex; align-items:center; gap:.9rem; padding:1rem 1.1rem;
  border:1px solid var(--line-1); border-radius:11px; background:var(--ink-2);
  cursor:pointer; transition:border-color .3s, background .3s;
}
.pay-opt:hover{ border-color:#3a3a40; }
.pay-opt.sel{ border-color:var(--gold); background:rgba(201,161,95,.06); }
.pay-opt .radio{ width:18px; height:18px; border-radius:50%; border:2px solid var(--line-1); flex:none; position:relative; transition:border-color .3s; }
.pay-opt.sel .radio{ border-color:var(--gold); }
.pay-opt.sel .radio::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--gold); }
.pay-opt .pt{ font-size:.9rem; font-weight:500; }
.pay-opt .ps{ font-family:var(--f-mono); font-size:.62rem; color:var(--muted); margin-top:.15rem; }
.pay-opt .tag{ margin-left:auto; font-family:var(--f-mono); font-size:.55rem; letter-spacing:.12em; text-transform:uppercase; color:var(--live); border:1px solid rgba(106,168,143,.4); border-radius:999px; padding:.25em .7em; }

/* summary */
.summary{
  background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px;
  padding:1.5rem; position:sticky; top:1.5rem;
}
.summary h2{ font-family:var(--f-display); font-weight:400; font-size:1.2rem; margin-bottom:1.2rem; }
.sum-row{ display:grid; grid-template-columns:52px 1fr auto; gap:.8rem; align-items:center; padding:.75rem 0; border-bottom:1px solid var(--line-soft); }
.sum-row img{ width:52px; height:52px; border-radius:7px; object-fit:cover; background:#f4f4f6; }
.sum-nm{ font-size:.85rem; line-height:1.3; }
.sum-q{ font-family:var(--f-mono); font-size:.62rem; color:var(--muted); margin-top:.15rem; }
.sum-pr{ font-family:var(--f-mono); font-size:.82rem; color:var(--gold-hi); white-space:nowrap; }
.sum-line{ display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:.78rem; color:var(--muted); padding:.35rem 0; }
.sum-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:.8rem; padding-top:1rem; border-top:1px solid var(--line-1); font-family:var(--f-mono); }
.sum-total span:last-child{ font-size:1.4rem; color:var(--gold-hi); font-weight:700; }
.place-btn{
  width:100%; margin-top:1.4rem; padding:1.05rem; border:none; border-radius:999px;
  font-family:var(--f-mono); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
  color:#0A1A2B; background:linear-gradient(180deg,#FBF6EA,#E9DCC0);
  position:relative; overflow:hidden; transition:transform .3s, box-shadow .3s;
}
.place-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 34px -14px rgba(201,161,95,.6); }
.place-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }
.trust{ display:flex; flex-wrap:wrap; gap:.8rem 1.2rem; margin-top:1.2rem; }
.trust span{ font-family:var(--f-mono); font-size:.56rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
.trust span::before{ content:"✓ "; color:var(--live); }

.empty-state{ text-align:center; padding:5rem 1rem; }
.empty-state p{ color:var(--muted); }
.empty-state a{ display:inline-block; margin-top:1.5rem; font-family:var(--f-mono); font-size:.64rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-hi); border-bottom:1px solid var(--gold); padding-bottom:.3rem; }

.back-link{ font-family:var(--f-mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:1.5rem; display:inline-block; }
.back-link:hover{ color:var(--gold-hi); }
</style>
<script src="js/transitions.js"></script>
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">THE AIM<b>.</b></a>
    <span class="secure">Secure checkout</span>
  </div>
</header>

<div class="wrap" id="page"></div>

<script src="js/products-data.js"></script>
<script src="js/cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script src="js/referral.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
