<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Your watchlist — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F6F6EC" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aim-design-tokens.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--swan); color:var(--ink); font-family:var(--f-sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
header{
  position:sticky; top:0; z-index:50;
  background:rgba(246,246,236,.88);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.nav{ max-width:760px; margin:0 auto; padding:0 1.4rem; height:72px; display:flex; align-items:center; }
.logo{ font-family:var(--f-sans); font-size:1.2rem; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); }
.logo b{ color:var(--ink); font-weight:900; }
.wrap{ max-width:640px; margin:0 auto; padding:clamp(2.5rem,6vw,4.5rem) 1.4rem 5rem; }
h1{ font-family:var(--f-sans); font-weight:800; font-size:clamp(1.9rem,4.5vw,2.8rem); letter-spacing:-.02em; color:var(--ink); }
.eyebrow{ font-family:var(--f-mono); font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); }
.lede{ color:var(--muted); margin-top:.8rem; font-size:.92rem; }
.back{ font-family:var(--f-mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); text-decoration:none; font-weight:600; }
.back:hover{ color:var(--ink); }
.tcard{ background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.85); border-radius:14px;
  padding:1.4rem; backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 8px 32px -12px rgba(0,7,45,.12), inset 0 1px 0 rgba(255,255,255,.95); margin-bottom:1.2rem; }
.tbtn{ display:inline-block; border:none; border-radius:999px; padding:.85rem 1.6rem; cursor:pointer; background:var(--ink);
  color:#FFFFFF; font-family:var(--f-mono); font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; font-weight:700;
  box-shadow:0 8px 20px -6px rgba(0,7,45,.3); transition:all .25s; text-decoration:none; }
.tbtn:hover{ background:var(--ink-soft); transform:translateY(-2px); }
</style>
<script src="js/transitions.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/layout-fix.css">
</head><body>
<header><div class="nav"><a href="index.html" class="logo">THE AIM<b>.</b></a>
  <a href="shop.html" class="back">← Shop</a><span data-account style="margin-left:auto"></span></div></header>

<main class="wrap" style="max-width:820px;padding:clamp(2rem,6vw,4rem) 1.25rem">
  <span class="eyebrow">Saved for later</span>
  <h1>Your <em>watchlist</em></h1>
  <p class="lede">Things you asked us to stock. When enough people want one, we order it —
    and you'll see it appear in the shop.</p>
  <div id="wlWrap"><p class="lede">Loading…</p></div>
</main>

<script src="js/upcoming-data.js"></script>
<script src="js/products-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script>
(function(){
  var KEY = 'ascentra_watch_v1';
  var wrap = document.getElementById('wlWrap');

  /* poll.js saves the watchlist as an object {id:true}; older code
     here expected an array. Accept either, so a customer who hearted
     something before this fix does not land on a broken page. */
  function asIds(raw){
    if(Array.isArray(raw)) return raw.map(String);
    if(raw && typeof raw === 'object') return Object.keys(raw).filter(function(k){ return raw[k]; });
    return [];
  }
  function list(){ try{ return asIds(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return []; } }
  function save2(a){ save(a); if(window.AimAccount && AimAccount.user()) AimAccount.pushWatch(a); }
  function save(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }

  var ITEMS = (typeof UPCOMING !== 'undefined') ? UPCOMING.slice() : [];
  var tally = {};

  // pull live vote counts + admin-managed items if the backend is on
  var A = window.Ascentra;
  if(A && A.configured && A.configured() && A.raw){
    A.raw.from('upcoming_tally').select('*')
      .then(function(res){
        if(res.data && res.data.length){
          ITEMS = res.data.map(function(r){
            tally[r.id] = r.vote_count || 0;
            return { id:r.id, name:r.name, category:r.category, img:r.img,
                     teaser:r.teaser, est:r.est_price };
          });
        }
        render();
      }).catch(render);
  } else { render(); }

  function render(){
    var ids = list();
    var mine = ITEMS.filter(function(i){ return ids.indexOf(String(i.id)) > -1; });

    if(!mine.length){
      wrap.innerHTML =
        '<div class="tcard" style="text-align:center;padding:3rem 1.4rem">' +
          '<p style="font-size:1.02rem;margin:0 0 .6rem">Nothing saved yet.</p>' +
          '<p style="color:var(--faint);font-size:.88rem;margin:0 0 1.4rem">' +
            'On the homepage, tap the heart on anything in <b>Dropping Next</b> to save it here.</p>' +
          '<a href="index.html#upcoming" class="tbtn" style="display:inline-block;width:auto;padding:.85rem 1.8rem;text-decoration:none">See what\u2019s dropping next</a>' +
        '</div>';
      return;
    }

    wrap.innerHTML = '<div class="wgrid">' + mine.map(function(i){
      var votes = tally[i.id];
      return '<div class="tcard wcard">' +
        '<div class="wimg"><img src="'+(i.img||'')+'" alt="'+i.name+'" /></div>' +
        '<div class="winfo">' +
          '<span class="bcat">'+(i.category||'')+'</span>' +
          '<h3>'+i.name+'</h3>' +
          (i.teaser ? '<p>'+i.teaser+'</p>' : '') +
          '<div class="wmeta">' +
            (i.est ? '<span class="west">Est. '+i.est+'</span>' : '') +
            (votes != null ? '<span class="wvotes">'+votes+' want it</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="brm" data-rm="'+i.id+'" aria-label="Remove">\u2715</button>' +
      '</div>';
    }).join('') + '</div>';

    wrap.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){
        save2(list().filter(function(x){ return x !== String(b.dataset.rm); }));
        render();
      });
    });
  }
})();
</script>
<style>
.wgrid{ display:grid; gap:.9rem; }
.wcard{ display:grid; grid-template-columns:78px 1fr auto; gap:1rem; align-items:center; padding:.9rem; }
.wimg{ width:78px; height:78px; border-radius:10px; overflow:hidden; background:rgba(255,255,255,.9);
  display:flex; align-items:center; justify-content:center; padding:4px; }
.wimg img{ width:100%; height:100%; object-fit:contain; }
.winfo{ min-width:0; }
.winfo h3{ font-family:var(--f-sans); font-weight:700; font-size:1rem; margin:.15rem 0 .3rem;
  line-height:1.2; overflow-wrap:anywhere; color:var(--ink); }
.winfo p{ font-size:.82rem; color:var(--muted); margin:0; line-height:1.5; }
.bcat{ font-family:var(--f-mono); font-size:.5rem; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); }
.wmeta{ display:flex; gap:.9rem; margin-top:.5rem; flex-wrap:wrap; }
.west, .wvotes{ font-family:var(--f-mono); font-size:.6rem; letter-spacing:.1em; }
.west{ color:var(--ink); font-weight:600; }
.wvotes{ color:var(--faint); }
.brm{ background:none; border:none; color:var(--faint); cursor:pointer; font-size:.8rem; padding:.4rem; align-self:start; }
.brm:hover{ color:var(--err); }
@media (max-width:560px){
  .wcard{ grid-template-columns:64px 1fr auto; gap:.75rem; }
  .wimg{ width:64px; height:64px; }
}
</style>
<script src="js/account.js"></script>
<script src="js/support.js"></script>
</body>
</html>
