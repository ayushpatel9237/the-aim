<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000"
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050818; --ink-2:#0A0F26; --ink-3:#080C1F;
  --line-1:#1A2142; --line-soft:#111735;
  --text:#FFF1E2; --muted:#8E96B8; --faint:#5F678E;
  --gold:#E6CBA8; --gold-hi:#F0DCC0; --live:#5FA88C; --err:#A98F6B;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Space Grotesk",system-ui,sans-serif; --f-mono:"Space Mono",monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#050818; background-image:radial-gradient(1200px 700px at 50% -20%, rgba(26,33,66,.42), transparent 70%); background-attachment:fixed; color:var(--text); font-family:var(--f-body); line-height:1.6; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; } button,input{ font:inherit; } button{ cursor:pointer; }
header{ position:sticky; top:0; z-index:50; background:transparent; transition:background .35s ease, border-color .35s ease, backdrop-filter .35s ease; border-bottom:1px solid transparent; }header.stuck{ background:rgba(5,8,24,.72); backdrop-filter:saturate(160%) blur(16px); -webkit-backdrop-filter:saturate(160%) blur(16px); border-bottom-color:rgba(230,203,168,.12); }
.nav{ max-width:1100px; margin:0 auto; padding:0 1.4rem; height:72px; display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:var(--f-display); font-size:1.15rem; letter-spacing:.3em; text-transform:uppercase; }
.logo b{ color:var(--gold); font-weight:400; }
.logo small{ font-family:var(--f-mono); font-size:.55rem; letter-spacing:.24em; color:var(--muted); display:block; margin-top:2px; }
.nav-right{ font-family:var(--f-mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); display:flex; gap:1.2rem; }
.nav-right button{ background:none; border:none; color:var(--muted); }
.nav-right button:hover, .nav-right a:hover{ color:var(--gold-hi); }
.wrap{ max-width:1100px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) 1.4rem 5rem; }
h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(1.8rem,4vw,2.5rem); margin-bottom:.4rem; }
h1 em{ font-style:italic; font-weight:300; color:var(--gold-hi); }
.panel{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:1.6rem; margin-top:1.8rem; }
.panel h2{ font-family:var(--f-display); font-weight:400; font-size:1.25rem; margin-bottom:1.1rem; }
.tabs{ display:flex; gap:.5rem; flex-wrap:wrap; margin:1.8rem 0 .5rem; border-bottom:1px solid var(--line-soft); }
.tab{ padding:.7rem 1.2rem; cursor:pointer; background:none; border:none; border-bottom:2px solid transparent; font-family:var(--f-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); transition:all .3s; }
.tab:hover{ color:var(--text); }
.tab.on{ color:var(--gold-hi); border-bottom-color:var(--gold); }
.tab .badge{ display:inline-block; margin-left:.5em; min-width:16px; padding:0 5px; border-radius:999px; font-size:.55rem; background:var(--gold); color:#050818; font-weight:700; }
.tabview{ display:none; } .tabview.on{ display:block; }
.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-top:1.5rem; }
@media (max-width:700px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
.scard{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:14px; padding:1.3rem; }
.scard .l{ font-family:var(--f-mono); font-size:.56rem; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
.scard .v{ font-family:var(--f-display); font-size:1.9rem; margin-top:.5rem; color:var(--gold-hi); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
@media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
.fld label{ display:block; font-family:var(--f-mono); font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.4rem; }
.fld input, .fld textarea, .fld select{ width:100%; background:var(--ink-3); border:1px solid var(--line-1); border-radius:9px; color:var(--text); font-size:.9rem; padding:.75rem 1rem; outline:none; transition:border-color .3s; font-family:var(--f-body); }
.fld input:focus, .fld textarea:focus{ border-color:var(--gold); }
.save-btn{ padding:.85rem 1.8rem; border:none; border-radius:999px; font-family:var(--f-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:#050818; background:#E6CBA8; cursor:pointer; }
.mini{ font-family:var(--f-mono); font-size:.54rem; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line-1); background:transparent; color:var(--text); border-radius:999px; padding:.35rem .8rem; cursor:pointer; margin-right:.3rem; }
.mini:hover{ border-color:var(--gold); color:var(--gold-hi); }
.mini.danger:hover{ border-color:var(--err); color:var(--err); }
.status-sel{ background:var(--ink-3); border:1px solid var(--line-1); color:var(--text); border-radius:999px; padding:.3rem .7rem; font-family:var(--f-mono); font-size:.58rem; cursor:pointer; }
.up-drop{ border:1px dashed var(--line-1); border-radius:11px; padding:1.4rem; text-align:center; cursor:pointer; color:var(--muted); font-family:var(--f-mono); font-size:.66rem; letter-spacing:.1em; transition:border-color .3s,color .3s; }
.up-drop:hover{ border-color:var(--gold); color:var(--gold-hi); }
.up-thumbs{ display:flex; gap:.7rem; flex-wrap:wrap; margin-top:.9rem; }
.up-thumb{ position:relative; width:70px; height:70px; border-radius:9px; overflow:hidden; border:1px solid var(--line-1); background:#FFF1E2; }
.up-thumb img{ width:100%; height:100%; object-fit:cover; }
.up-thumb .rm{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(12,12,13,.8); color:#fff; border:none; cursor:pointer; font-size:.7rem; line-height:1; }
.up-thumb.main::after{ content:"MAIN"; position:absolute; bottom:0; left:0; right:0; background:var(--gold); color:#050818; font-family:var(--f-mono); font-size:.44rem; letter-spacing:.1em; text-align:center; padding:1px; }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-family:var(--f-mono); font-size:.55rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); padding:.6rem .5rem; border-bottom:1px solid var(--line-1); }
td{ padding:.75rem .5rem; border-bottom:1px solid var(--line-soft); font-size:.85rem; vertical-align:middle; }
td.mono{ font-family:var(--f-mono); }
.pill{ font-family:var(--f-mono); font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; padding:.3em .7em; border-radius:999px; }
.pill-live{ color:var(--live); border:1px solid rgba(106,168,143,.4); }
.pill-wait{ color:var(--gold-hi); border:1px solid rgba(201,161,95,.4); }
.pill-off{ color:var(--faint); border:1px solid var(--line-1); }
.act{ font-family:var(--f-mono); font-size:.55rem; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line-1); background:transparent; color:var(--text); border-radius:999px; padding:.4rem .8rem; margin-right:.4rem; transition:all .3s; }
.act:hover{ border-color:var(--gold); color:var(--gold-hi); }
.act.go{ background:#E6CBA8; color:#050818; border-color:transparent; font-weight:700; }
.empty-note{ text-align:center; color:var(--faint); font-family:var(--f-mono); font-size:.66rem; padding:2rem; }
.gate{ max-width:460px; margin:3rem auto; background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:2rem; text-align:center; }
.gate h2{ font-family:var(--f-display); font-weight:400; }
.gate p{ color:var(--muted); margin-top:.8rem; font-size:.9rem; }
.gate input{ width:100%; background:var(--ink-3); border:1px solid var(--line-1); border-radius:9px; color:var(--text); padding:.8rem 1rem; margin-top:1rem; outline:none; }
.gate button{ width:100%; margin-top:1rem; padding:.95rem; border:none; border-radius:999px; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:#050818; background:#E6CBA8; }
.msg{ font-family:var(--f-mono); font-size:.66rem; margin-top:1rem; color:var(--err); }

.or-divider{ display:flex; align-items:center; gap:1rem; margin:1.2rem 0; }
.or-divider::before, .or-divider::after{ content:""; flex:1; height:1px; background:var(--line-1); }
.or-divider span{ font-family:var(--f-mono); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
.google-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:.7rem;
  padding:.9rem; border-radius:999px; cursor:pointer;
  background:#fff; color:#0A0F26; border:none;
  font-family:var(--f-body); font-size:.9rem; font-weight:500; transition:transform .3s, box-shadow .3s;
}
.google-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(0,0,0,.5); }
.google-btn svg{ flex:none; }

/* ══ APP SHELL ══ */
body.app{ display:flex; min-height:100vh; }
.sidebar{ width:236px; flex:none; background:#030510; border-right:1px solid var(--line-soft); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.sb-logo{ padding:1.6rem 1.4rem 1.2rem; border-bottom:1px solid var(--line-soft); }
.sb-logo .mark{ font-family:var(--f-display); font-size:1.05rem; letter-spacing:.3em; text-transform:uppercase; }
.sb-logo .mark b{ color:var(--gold); font-weight:400; }
.sb-logo .sub{ font-family:var(--f-mono); font-size:.52rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); margin-top:.35rem; }
.sb-section{ font-family:var(--f-mono); font-size:.5rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); padding:1.4rem 1.4rem .6rem; }
.nav-item{ display:flex; align-items:center; gap:.8rem; width:100%; text-align:left; padding:.75rem 1.4rem; background:none; border:none; cursor:pointer; font-family:var(--f-body); font-size:.88rem; color:var(--muted); border-left:2px solid transparent; transition:all .25s; }
.nav-item:hover{ color:var(--text); background:rgba(255,255,255,.02); }
.nav-item.on{ color:var(--gold-hi); border-left-color:var(--gold); background:rgba(201,161,95,.06); }
.nav-item .ic{ width:18px; text-align:center; opacity:.9; }
.nav-item .cnt{ margin-left:auto; min-width:18px; padding:0 5px; border-radius:999px; font-family:var(--f-mono); font-size:.54rem; background:var(--gold); color:#050818; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
.sb-bottom{ margin-top:auto; padding:1.2rem 1.4rem; border-top:1px solid var(--line-soft); }
.sb-bottom a, .sb-bottom button{ display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:.4rem 0; }
.sb-bottom a:hover, .sb-bottom button:hover{ color:var(--gold-hi); }
.main{ flex:1; min-width:0; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.5rem clamp(1.2rem,3vw,2.2rem); border-bottom:1px solid var(--line-soft); position:sticky; top:0; background:rgba(12,12,13,.9); backdrop-filter:blur(10px); z-index:20; }
.topbar h1{ font-family:var(--f-display); font-weight:400; font-size:1.5rem; margin:0; }
.topbar .sub{ font-family:var(--f-mono); font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-top:.3rem; }
.avatar{ width:38px; height:38px; border-radius:50%; background:#E6CBA8; color:#050818; font-family:var(--f-mono); font-weight:700; font-size:.78rem; display:flex; align-items:center; justify-content:center; flex:none; }
.content{ padding:clamp(1.2rem,3vw,2.2rem); max-width:1200px; }
.page-v{ display:none; } .page-v.on{ display:block; }
.sb-toggle{ display:none; background:none; border:none; color:var(--text); font-size:1.3rem; cursor:pointer; }
@media (max-width:860px){ .sidebar{ position:fixed; left:-236px; z-index:60; transition:left .3s; box-shadow:0 0 40px rgba(0,0,0,.6);} .sidebar.open{ left:0; } .sb-toggle{ display:block; } }
.card{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:1.5rem; margin-bottom:1.4rem; }
.card-header{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap; }
.card-title{ font-family:var(--f-display); font-weight:400; font-size:1.2rem; }
.empty-state{ text-align:center; padding:3rem 1rem; }
.empty-state .ico{ font-size:2rem; opacity:.35; margin-bottom:.8rem; }
.empty-state p{ color:var(--faint); font-family:var(--f-mono); font-size:.68rem; letter-spacing:.1em; }

/* ══════════════════════════════════════════════════════════
   ADMIN CONSOLE — true black, high contrast, built for work
══════════════════════════════════════════════════════════ */
:root{
  --ink:#000000; --ink-2:#0B0B0C; --ink-3:#131315;
  --line-1:#26262A; --line-soft:#1A1A1D;
  --text:#F4F4F5; --muted:#A1A1A6; --faint:#6E6E76;
  --gold:#FFFFFF; --gold-hi:#FFFFFF;
  --live:#30D158; --err:#FF453A;
}
body{ background:#000000 !important; background-image:none !important; color:#F4F4F5 !important; }
.sidebar{ background:#000000 !important; border-right:1px solid #1A1A1D !important; }
.sb-logo{ border-bottom:1px solid #1A1A1D !important; }
.sb-logo .mark, .sb-logo .mark b{ color:#FFFFFF !important; }
.sb-section{ color:#6E6E76 !important; }
.nav-item{ color:#A1A1A6 !important; }
.nav-item:hover{ color:#FFFFFF !important; background:rgba(255,255,255,.04) !important; }
.nav-item.on{ color:#FFFFFF !important; border-left-color:#FFFFFF !important; background:rgba(255,255,255,.07) !important; }
.nav-item .cnt{ background:#FFFFFF !important; color:#000000 !important; }
.sb-bottom{ border-top:1px solid #1A1A1D !important; }
.sb-bottom a, .sb-bottom button{ color:#A1A1A6 !important; }
.sb-bottom a:hover, .sb-bottom button:hover{ color:#FFFFFF !important; }

.topbar{ background:rgba(0,0,0,.9) !important; border-bottom:1px solid #1A1A1D !important; }
.topbar h1{ color:#FFFFFF !important; }
.topbar .sub{ color:#6E6E76 !important; }
.avatar{ background:#FFFFFF !important; color:#000000 !important; }

/* panels: near-black with a hairline */
.card, .panel, .scard{
  background:#0B0B0C !important; border:1px solid #1F1F23 !important;
  border-radius:10px !important; box-shadow:none !important;
}
.card:hover, .panel:hover{ transform:none !important; box-shadow:none !important; }
.card-title, h1, h2, h3{ color:#FFFFFF !important; }
.scard .l{ color:#6E6E76 !important; } .scard .v{ color:#FFFFFF !important; }

/* inputs: dark fields, clear focus */
input, select, textarea{
  background:#131315 !important; border:1px solid #2A2A2E !important; color:#F4F4F5 !important; border-radius:8px !important;
}
input:focus, textarea:focus{ border-color:#FFFFFF !important; box-shadow:0 0 0 3px rgba(255,255,255,.10) !important; }
.fld label{ color:#6E6E76 !important; }

/* buttons */
.save-btn{ background:#FFFFFF !important; color:#000000 !important; border-radius:8px !important; }
.save-btn:hover{ background:#E5E5E7 !important; }
.mini{ background:transparent !important; border:1px solid #2A2A2E !important; color:#F4F4F5 !important; border-radius:7px !important; }
.mini:hover{ background:#1A1A1D !important; border-color:#3A3A40 !important; color:#FFFFFF !important; }
.mini.danger:hover{ border-color:#FF453A !important; color:#FF453A !important; }
.google-btn{ background:#FFFFFF !important; color:#000000 !important; border:none !important; }
.status-sel{ background:#131315 !important; border:1px solid #2A2A2E !important; color:#F4F4F5 !important; border-radius:7px !important; }

/* tables */
table th{ color:#6E6E76 !important; border-bottom:1px solid #1F1F23 !important; }
table td{ border-bottom:1px solid #141417 !important; color:#F4F4F5 !important; }
table tr:hover td{ background:rgba(255,255,255,.03) !important; }

/* pills + uploader */
.pill{ background:#131315 !important; border:1px solid #2A2A2E !important; backdrop-filter:none !important; }
.pill-live{ color:#30D158 !important; border-color:#1E4D33 !important; }
.pill-wait{ color:#FFD60A !important; border-color:#4D451E !important; }
.pill-off{ color:#A1A1A6 !important; }
.up-drop{ border:1px dashed #2A2A2E !important; color:#A1A1A6 !important; }
.up-drop:hover{ border-color:#FFFFFF !important; color:#FFFFFF !important; }
.up-thumb{ border:1px solid #2A2A2E !important; background:#131315 !important; }
.empty-state .ico{ opacity:.25; } .empty-state p, .empty-note{ color:#6E6E76 !important; }
.tabs{ border-bottom:1px solid #1A1A1D !important; }

/* ══════════════════════════════════════════════════════════
   PRODUCT EDITOR — a full panel, everything visible at once
══════════════════════════════════════════════════════════ */
.ed-scrim{ position:fixed; inset:0; z-index:8000; background:rgba(0,0,0,.7);
  opacity:0; transition:opacity .3s ease; }
.ed-scrim.on{ opacity:1; }
.ed{ position:fixed; top:0; right:0; bottom:0; z-index:8001; width:min(680px,96vw);
  background:#0B0B0C; border-left:1px solid #1F1F23; overflow-y:auto;
  transform:translateX(100%); transition:transform .42s cubic-bezier(.2,.7,.24,1); }
.ed.on{ transform:none; }
.ed-head{ position:sticky; top:0; z-index:3; display:flex; align-items:center;
  justify-content:space-between; gap:1rem; padding:1.1rem 1.3rem;
  background:rgba(11,11,12,.95); border-bottom:1px solid #1F1F23; backdrop-filter:blur(12px); }
.ed-head h2{ font-size:1.05rem; margin:0; color:#FFF; }
.ed-head .sub{ font-family:var(--f-mono); font-size:.54rem; letter-spacing:.16em;
  text-transform:uppercase; color:#6E6E76; margin-top:.25rem; }
.ed-x{ width:34px; height:34px; border-radius:8px; border:1px solid #2A2A2E; background:none;
  color:#F4F4F5; cursor:pointer; flex:none; }
.ed-x:hover{ background:#1A1A1D; }
.ed-body{ padding:1.3rem; }
.ed-sec{ margin-bottom:1.6rem; }
.ed-sec > h3{ font-family:var(--f-mono); font-size:.55rem; letter-spacing:.2em;
  text-transform:uppercase; color:#6E6E76; margin:0 0 .8rem; padding-bottom:.5rem;
  border-bottom:1px solid #1F1F23; }
/* image manager */
.ed-imgs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:.6rem; }
.ed-img{ position:relative; aspect-ratio:1; border-radius:9px; overflow:hidden;
  border:1px solid #2A2A2E; background:#fff; display:flex; align-items:center; justify-content:center; }
.ed-img img{ width:100%; height:100%; object-fit:contain; }
.ed-img .rm{ position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
  background:rgba(0,0,0,.75); color:#fff; border:none; cursor:pointer; font-size:.65rem; line-height:1; }
.ed-img .mk{ position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,.7); color:#fff;
  border:none; border-radius:5px; padding:2px 5px; font-size:.45rem; cursor:pointer;
  font-family:var(--f-mono); letter-spacing:.1em; }
.ed-img.main{ border-color:#FFF; }
.ed-img.main::after{ content:"MAIN"; position:absolute; top:4px; left:4px; background:#FFF;
  color:#000; font-family:var(--f-mono); font-size:.42rem; letter-spacing:.1em; padding:2px 5px; border-radius:4px; }
.ed-add{ aspect-ratio:1; border:1px dashed #2A2A2E; border-radius:9px; background:none; color:#A1A1A6;
  cursor:pointer; display:flex; align-items:center; justify-content:center; flex-direction:column;
  gap:.25rem; font-family:var(--f-mono); font-size:.5rem; letter-spacing:.1em; }
.ed-add:hover{ border-color:#FFF; color:#FFF; }
.ed-add b{ font-size:1.2rem; font-weight:400; }
/* video preview */
.ed-vid{ display:grid; gap:.6rem; }
.ed-vid .prev{ aspect-ratio:9/16; max-height:260px; border-radius:10px; overflow:hidden;
  background:#131315; border:1px solid #2A2A2E; }
.ed-vid .prev iframe, .ed-vid .prev video{ width:100%; height:100%; border:0; }
.ed-foot{ position:sticky; bottom:0; display:flex; gap:.6rem; padding:1rem 1.3rem;
  background:rgba(11,11,12,.96); border-top:1px solid #1F1F23; backdrop-filter:blur(12px); }
.ed-foot .save-btn{ flex:1; }
@media (max-width:600px){ .ed-body{ padding:1rem; } .ed-imgs{ grid-template-columns:repeat(3,1fr); } }
</style>
<script src="js/transitions.js"></script>
<link rel="stylesheet" href="css/responsive.css">
</head>

<header><div class="nav">
  <a href="index.html" class="logo">THE AIM<b>.</b><small>Admin</small></a>
  <div class="nav-right" id="navRight"><a href="index.html">← Store</a></div>
</div></header>
<div class="wrap" id="page"><div class="empty-note">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script src="js/video.js"></script>
<script>
(function(){
  var page = document.getElementById('page');
  var navRight = document.getElementById('navRight');
  var A = window.Ascentra;
  var fmt = function(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); };

  if(!A || !A.configured()){
    page.innerHTML = '<div class="gate"><h2>Not connected</h2><p>Add your Supabase keys to <b>js/config.js</b> first.</p></div>';
    return;
  }

  async function gate(){
    var user = await A.currentUser();
    if(!user){ renderLogin(); return; }
    var role = (user.app_metadata && user.app_metadata.role) || '';
    if(role !== 'admin'){
      page.innerHTML = '<div class="gate"><h2>Not authorised</h2>' +
        '<p>This account isn\'t an admin. In Supabase SQL editor run:</p>' +
        '<p style="font-family:var(--f-mono);font-size:.72rem;color:var(--gold-hi);margin-top:.8rem;word-break:break-all">update auth.users set raw_app_meta_data = raw_app_meta_data || \'{"role":"admin"}\' where email=\''+user.email+'\';</p>' +
        '<button onclick="location.reload()" style="margin-top:1.4rem">I\'ve done it — reload</button></div>';
      setSignOut(); return;
    }
    renderAdmin(); setSignOut();
  }
  function setSignOut(){
    navRight.innerHTML = '<a href="index.html">← Store</a><button id="so">Sign out</button>';
    document.getElementById('so').addEventListener('click', async function(){ await A.signOut(); location.reload(); });
  }
  function renderLogin(){
    page.innerHTML = '<div class="gate"><h2>Admin login</h2>' +
      '<input id="e" type="email" placeholder="Email" /><input id="p" type="password" placeholder="Password" />' +
      '<button id="go">Log in</button>' + '<div class="or-divider"><span>or</span></div>' + '<button class="google-btn" id="ggl"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>Continue with Google</button>' + '<div class="msg" id="m"></div></div>';
    document.getElementById('go').addEventListener('click', async function(){
      var r = await A.signIn(document.getElementById('e').value.trim(), document.getElementById('p').value);
      if(r.error){ document.getElementById('m').textContent = r.error.message; return; }
      gate();
    });
    var g = document.getElementById('ggl');
    if(g) g.addEventListener('click', function(){ A.raw.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href.split('#')[0] } }); });
  }

  async function renderAdmin(){
    var user = await A.currentUser();
    var email = (user && user.email) || '';
    var initials = email.slice(0,2).toUpperCase();
    var hour = new Date().getHours();
    var greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

    document.body.className = 'app';
    document.body.innerHTML =
      '<aside class="sidebar" id="sidebar">' +
        '<div class="sb-logo"><div class="mark">THE AIM<b>.</b></div><div class="sub">Control Centre</div></div>' +
        '<div class="sb-section">Overview</div>' +
        '<button class="nav-item on" data-t="dash"><span class="ic">◈</span>Dashboard</button>' +
        '<div class="sb-section">Shop</div>' +
        '<button class="nav-item" data-t="products"><span class="ic">▣</span>Products</button>' +
        '<button class="nav-item" data-t="orders"><span class="ic">▤</span>Orders<span class="cnt" id="cntOrders" style="display:none"></span></button>' +
        '<div class="sb-section">Homepage</div>' +
        '<button class="nav-item" data-t="feed"><span class="ic">▶</span>Feed reels</button>' +
        '<button class="nav-item" data-t="upcoming"><span class="ic">◔</span>Dropping Next</button>' +
        '<div class="sb-section">Partners</div>' +
        '<button class="nav-item" data-t="curators"><span class="ic">◉</span>Curators<span class="cnt" id="cntCur" style="display:none"></span></button>' +
        '<button class="nav-item" data-t="payouts"><span class="ic">◇</span>Payouts<span class="cnt" id="cntPay" style="display:none"></span></button>' +
        '<div class="sb-bottom">' +
          '<a href="index.html">← View store</a>' +
          '<button id="signOutBtn">Sign out</button>' +
        '</div>' +
      '</aside>' +
      '<div class="main">' +
        '<div class="topbar">' +
          '<div style="display:flex;align-items:center;gap:1rem">' +
            '<button class="sb-toggle" id="sbToggle">☰</button>' +
            '<div><h1 id="pgTitle">' + greet + '.</h1><div class="sub" id="pgSub">' + email + '</div></div>' +
          '</div>' +
          '<div class="avatar">' + initials + '</div>' +
        '</div>' +
        '<div class="content">' +
          '<div class="page-v on" id="v-dash"><div class="stat-row" id="statRow"></div>' +
            '<div class="card" style="margin-top:1.4rem"><div class="card-header"><span class="card-title">Recent orders</span></div>' +
            '<div id="recentOrders"><div class="empty-note">Loading…</div></div></div></div>' +
          '<div class="page-v" id="v-products">' +
            '<div class="card"><div class="card-header"><span class="card-title" id="pfTitle">Add a product</span></div>' +
              '<input type="hidden" id="pf-images" value="[]" />' +
              '<div class="form-grid">' +
                '<div class="fld"><label>Product ID (no spaces)</label><input id="pf-id" placeholder="e.g. moon_lamp" /></div>' +
                '<div class="fld"><label>Name</label><input id="pf-name" placeholder="Starry Sky Moon Lamp" /></div>' +
              '</div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Short description</label><input id="pf-short" placeholder="One line customers see first" /></div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Full description</label><textarea id="pf-desc" rows="3" placeholder="Full details for the product page..."></textarea></div>' +
              '<div class="form-grid">' +
                '<div class="fld"><label>Price (INR)</label><input id="pf-price" type="number" placeholder="1299" /></div>' +
                '<div class="fld"><label>MRP (optional)</label><input id="pf-mrp" type="number" placeholder="2499" /></div>' +
                '<div class="fld"><label>Stock</label><input id="pf-stock" type="number" placeholder="100" /></div>' +
                '<div class="fld"><label>Category</label><select id="pf-cat"><option>Room</option><option>Desk</option><option>Gadgets</option><option>Storage</option><option>Daily Essentials</option></select></div>' +
              '</div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Video link (optional)</label><input id="pf-video" placeholder="Instagram / YouTube / .mp4 link" /></div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Product images</label>' +
                '<input type="file" id="pf-file" accept="image/*" multiple hidden />' +
                '<div class="up-drop" id="upDrop">＋ Click to upload images (first = main photo)</div>' +
                '<div class="up-thumbs" id="upThumbs"></div></div>' +
              '<div class="form-grid"><div class="fld"><label>Status</label><select id="pf-status"><option value="active">Active (live)</option><option value="draft">Draft (hidden)</option><option value="paused">Paused</option></select></div></div>' +
              '<button class="save-btn" id="pf-save">Save product</button> <button class="mini" id="pf-clear" style="margin-left:.5rem">Clear</button>' +
              '<div class="msg" id="pf-msg"></div></div>' +
            '<div class="card"><div class="card-header"><span class="card-title">All products</span>' +
              '<button class="save-btn" id="newProd" style="padding:.6rem 1.1rem">+ New product</button>' +
              '<input id="prodSearch" placeholder="Search…" style="background:var(--ink-3);border:1px solid var(--line-1);border-radius:999px;color:var(--text);padding:.6rem 1.1rem;outline:none;font-size:.85rem" /></div>' +
              '<div id="prodWrap"><div class="empty-note">Loading…</div></div></div></div>' +
          '<div class="page-v" id="v-orders"><div class="card"><div class="card-header"><span class="card-title">Orders</span></div><div id="ordWrap"><div class="empty-note">Loading…</div></div></div></div>' +
          '<div class="page-v" id="v-feed">' +
            '<div class="card"><div class="card-header"><span class="card-title" id="ffTitle">Add a reel</span></div>' +
              '<div class="form-grid">' +
                '<div class="fld"><label>Caption</label><input id="ff-name" placeholder="Butterfly Phone Stand — in use" /></div>' +
                '<div class="fld"><label>Links to product (id, optional)</label><input id="ff-shop" placeholder="22_butterfly_phone_stand" /></div>' +
              '</div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Video link (Instagram / YouTube / .mp4)</label><input id="ff-video" placeholder="https://..." /></div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Poster image (shown before play)</label>' +
                '<input type="file" id="ff-file" accept="image/*" hidden />' +
                '<div class="up-drop" id="ffDrop">＋ Upload a poster image</div>' +
                '<div class="up-thumbs" id="ffThumb"></div></div>' +
              '<div class="form-grid"><div class="fld"><label>Order</label><input id="ff-order" type="number" value="0" /></div></div>' +
              '<button class="save-btn" id="ff-save">Save reel</button> <button class="mini" id="ff-clear" style="margin-left:.5rem">Clear</button>' +
              '<div class="msg" id="ff-msg"></div></div>' +
            '<div class="card"><div class="card-header"><span class="card-title">Reels on your homepage</span></div><div id="feedWrap"><div class="empty-note">Loading…</div></div></div></div>' +
          '<div class="page-v" id="v-upcoming">' +
            '<div class="card"><div class="card-header"><span class="card-title" id="ufTitle">Add an upcoming item</span></div>' +
              '<div class="form-grid">' +
                '<div class="fld"><label>Name</label><input id="uf-name" placeholder="Magnetic Neck Fan" /></div>' +
                '<div class="fld"><label>Category</label><select id="uf-cat"><option>Room</option><option>Desk</option><option>Gadgets</option><option>Storage</option><option>Daily Essentials</option></select></div>' +
              '</div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Teaser line</label><input id="uf-teaser" placeholder="Hands-free bladeless cooling" /></div>' +
              '<div class="form-grid"><div class="fld"><label>Estimated price</label><input id="uf-price" placeholder="₹899" /></div>' +
                '<div class="fld"><label>Order</label><input id="uf-order" type="number" value="0" /></div></div>' +
              '<div class="fld" style="margin-bottom:1rem"><label>Image</label>' +
                '<input type="file" id="uf-file" accept="image/*" hidden />' +
                '<div class="up-drop" id="ufDrop">＋ Upload an image</div>' +
                '<div class="up-thumbs" id="ufThumb"></div></div>' +
              '<button class="save-btn" id="uf-save">Save item</button> <button class="mini" id="uf-clear" style="margin-left:.5rem">Clear</button>' +
              '<div class="msg" id="uf-msg"></div></div>' +
            '<div class="card"><div class="card-header"><span class="card-title">Items people are voting on</span></div><div id="upWrap"><div class="empty-note">Loading…</div></div></div></div>' +
          '<div class="page-v" id="v-curators"><div class="card"><div class="card-header"><span class="card-title">Curators</span></div><div id="curWrap"><div class="empty-note">Loading…</div></div></div></div>' +
          '<div class="page-v" id="v-payouts"><div class="card"><div class="card-header"><span class="card-title">Payout requests</span></div><div id="payWrap"><div class="empty-note">Loading…</div></div></div></div>' +
        '</div>' +
      '</div>';

    var titles = { dash:greet+'.', products:'Products', orders:'Orders', feed:'Feed reels', upcoming:'Dropping Next', curators:'Curators', payouts:'Payouts' };
    var subs   = { dash:email, products:'Add, edit and manage what you sell', orders:'Fulfil and track every order',
                   feed:'Videos on your homepage', upcoming:'What customers vote to stock next',
                   curators:'Approve and manage your partners', payouts:'Pay your curators' };
    document.querySelectorAll('.nav-item').forEach(function(t){
      t.addEventListener('click', function(){
        document.querySelectorAll('.nav-item').forEach(function(z){ z.classList.remove('on'); });
        document.querySelectorAll('.page-v').forEach(function(z){ z.classList.remove('on'); });
        t.classList.add('on');
        document.getElementById('v-'+t.dataset.t).classList.add('on');
        document.getElementById('pgTitle').textContent = titles[t.dataset.t];
        document.getElementById('pgSub').textContent = subs[t.dataset.t];
        document.getElementById('sidebar').classList.remove('open');
        window.scrollTo({top:0});
      });
    });
    document.getElementById('sbToggle').addEventListener('click', function(){
      document.getElementById('sidebar').classList.toggle('open');
    });
    document.getElementById('signOutBtn').addEventListener('click', async function(){
      await A.signOut(); location.reload();
    });

    loadDashboard(); loadProducts(); loadOrders(); loadCurators(); loadPayouts(); loadFeed(); loadUpcoming();
    setTimeout(function(){
      var np = document.getElementById('newProd');
      if(np) np.addEventListener('click', function(){ openEditor({}); });
    }, 100);
    wireProductForm();
  }

  async function loadDashboard(){
    var orders = await A.allOrders();
    var curators = await A.allCurators();
    var paidOrders = orders.filter(function(o){ return ['paid','confirmed','shipped','delivered'].indexOf(o.status)>-1; });
    var revenue = paidOrders.reduce(function(s,o){ return s + Number(o.total||0); }, 0);
    var pendingCur = curators.filter(function(c){ return c.status==='pending'; }).length;
    document.getElementById('statRow').innerHTML =
      '<div class="scard"><div class="l">Total orders</div><div class="v">'+orders.length+'</div></div>' +
      '<div class="scard"><div class="l">Revenue</div><div class="v">'+fmt(revenue)+'</div></div>' +
      '<div class="scard"><div class="l">Curators</div><div class="v">'+curators.length+'</div></div>' +
      '<div class="scard"><div class="l">Pending approvals</div><div class="v">'+pendingCur+'</div></div>';
    var cc = document.getElementById('cntCur');
    if(cc){ if(pendingCur){ cc.textContent = pendingCur; cc.style.display='inline-flex'; } else cc.style.display='none'; }
    var newOrders = orders.filter(function(o){ return ['paid','confirmed'].indexOf(o.status)>-1; }).length;
    var co = document.getElementById('cntOrders');
    if(co){ if(newOrders){ co.textContent = newOrders; co.style.display='inline-flex'; } else co.style.display='none'; }
    var recent = orders.slice(0,5);
    document.getElementById('recentOrders').innerHTML = recent.length
      ? '<table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
        recent.map(function(o){ return '<tr><td class="mono">'+o.id+'</td>' +
          '<td>'+((o.customer&&o.customer.name)||'—')+'</td>' +
          '<td class="mono" style="color:var(--gold-hi)">'+fmt(o.total)+'</td>' +
          '<td><span class="pill pill-wait">'+o.status+'</span></td></tr>'; }).join('') + '</tbody></table>'
      : '<div class="empty-state"><div class="ico">▤</div><p>No orders yet</p></div>';
  }

  function wireProductForm(){
    var images = [];
    function renderThumbs(){
      document.getElementById('pf-images').value = JSON.stringify(images);
      document.getElementById('upThumbs').innerHTML = images.map(function(url,i){
        return '<div class="up-thumb'+(i===0?' main':'')+'"><img src="'+url+'" alt="" />' +
          '<button class="rm" data-rm="'+i+'">×</button></div>';
      }).join('');
      document.querySelectorAll('[data-rm]').forEach(function(b){
        b.addEventListener('click', function(){ images.splice(parseInt(b.dataset.rm),1); renderThumbs(); });
      });
    }
    window._pfSetImages = function(arr){ images = arr||[]; renderThumbs(); };

    document.getElementById('upDrop').addEventListener('click', function(){ document.getElementById('pf-file').click(); });
    document.getElementById('pf-file').addEventListener('change', async function(e){
      var files = Array.prototype.slice.call(e.target.files);
      var drop = document.getElementById('upDrop');
      drop.textContent = 'Uploading…';
      for(var i=0;i<files.length;i++){
        try{ var url = await A.uploadImage(files[i]); images.push(url); renderThumbs(); }
        catch(err){ alert('Upload failed: ' + err.message); }
      }
      drop.textContent = '＋ Click to upload images (first one is the main photo)';
      e.target.value='';
    });

    document.getElementById('pf-save').addEventListener('click', async function(){
      var id = document.getElementById('pf-id').value.trim().toLowerCase().replace(/\s+/g,'_');
      var name = document.getElementById('pf-name').value.trim();
      var price = parseFloat(document.getElementById('pf-price').value);
      var msg = document.getElementById('pf-msg');
      if(!id || !name || !(price>0)){ msg.style.color='var(--err)'; msg.textContent='Fill ID, name and a valid price.'; return; }
      var prod = {
        id:id, name:name, price:price,
        mrp: parseFloat(document.getElementById('pf-mrp').value) || null,
        stock: parseInt(document.getElementById('pf-stock').value) || 0,
        short_desc: document.getElementById('pf-short').value.trim() || null,
        description: document.getElementById('pf-desc').value.trim() || null,
        category: document.getElementById('pf-cat').value,
        video: document.getElementById('pf-video').value.trim() || null,
        images: images,
        status: document.getElementById('pf-status').value,
        active: document.getElementById('pf-status').value === 'active'
      };
      msg.style.color='var(--muted)'; msg.textContent='Saving…';
      var res = await A.saveProduct(prod);
      if(res.error){ msg.style.color='var(--err)'; msg.textContent=res.error.message; return; }
      msg.style.color='var(--live)'; msg.textContent='Saved ✓';
      document.getElementById('pf-clear').click();
      loadProducts(); loadDashboard();
    });
    document.getElementById('pf-clear').addEventListener('click', function(){
      ['pf-id','pf-name','pf-price','pf-mrp','pf-stock','pf-short','pf-desc','pf-video'].forEach(function(i){ var el=document.getElementById(i); if(el) el.value=''; });
      document.getElementById('pfTitle').textContent='Add a product';
      document.getElementById('pf-id').disabled=false;
      images = []; renderThumbs();
    });
  }
  async function loadProducts(){
    var rows = await A.allProducts();
    window._allProducts = rows;
    renderProductList(rows);
    var search = document.getElementById('prodSearch');
    if(search && !search._wired){
      search._wired = true;
      search.addEventListener('input', function(){
        var q = search.value.toLowerCase();
        renderProductList((window._allProducts||[]).filter(function(p){
          return (p.id+' '+p.name+' '+(p.category||'')).toLowerCase().indexOf(q) > -1;
        }));
      });
    }
  }
  function renderProductList(rows){
    var wrap = document.getElementById('prodWrap');
    if(!rows.length){ wrap.innerHTML = '<div class="empty-state"><div class="ico">▣</div><p>No products yet — add your first above</p></div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
      rows.map(function(p){
        var img = (p.images && p.images.length) ? p.images[0] : '';
        var thumb = img ? '<img src="'+img+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover;background:#FFF1E2" />' : '<div style="width:40px;height:40px;border-radius:6px;background:var(--ink-3)"></div>';
        var st = p.status || (p.active?'active':'draft');
        var pill = st==='active'?'<span class="pill pill-live">Live</span>':st==='draft'?'<span class="pill pill-off">Draft</span>':'<span class="pill pill-wait">Paused</span>';
        return '<tr><td>'+thumb+'</td><td>'+p.name+'<br><span style="color:var(--faint);font-size:.68rem">'+p.id+'</span></td>' +
          '<td class="mono" style="color:var(--gold-hi)">'+fmt(p.price)+'</td><td class="mono">'+p.stock+'</td>' +
          '<td>'+pill+'</td>' +
          '<td><button class="mini" data-edit="'+p.id+'">Edit</button><button class="mini danger" data-del="'+p.id+'">Delete</button></td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-edit]').forEach(function(b){
      b.addEventListener('click', function(){
        var p = (window._allProducts||[]).find(function(x){ return x.id===b.dataset.edit; });
        if(window.openEditor){ openEditor(p); return; }
        document.getElementById('pf-id').value=p.id; document.getElementById('pf-id').disabled=true;
        document.getElementById('pf-name').value=p.name;
        document.getElementById('pf-price').value=p.price;
        document.getElementById('pf-mrp').value=p.mrp||'';
        document.getElementById('pf-stock').value=p.stock;
        document.getElementById('pf-short').value=p.short_desc||'';
        document.getElementById('pf-desc').value=p.description||'';
        document.getElementById('pf-cat').value=p.category||'Gadgets';
        document.getElementById('pf-video').value=p.video||'';
        document.getElementById('pf-status').value=p.status||(p.active?'active':'draft');
        if(window._pfSetImages) window._pfSetImages(p.images||[]);
        document.getElementById('pfTitle').textContent='Edit: '+p.name;
        window.scrollTo({top:0,behavior:'smooth'});
      });
    });
    wrap.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', async function(){
        if(!confirm('Delete this product?')) return;
        await A.deleteProduct(b.dataset.del); loadProducts(); loadDashboard();
      });
    });
  }
  async function loadOrders(){
    var rows = await A.allOrders();
    var wrap = document.getElementById('ordWrap');
    if(!rows.length){ wrap.innerHTML = '<div class="empty-state"><div class="ico">▤</div><p>No orders yet</p></div>'; return; }
    var statuses = ['pending_payment','paid','confirmed','shipped','delivered','cancelled'];
    wrap.innerHTML = '<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
      rows.map(function(o){
        var items = (o.items||[]).map(function(i){ return i.qty+'x '+i.name; }).join(', ');
        var opts = statuses.map(function(s){ return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'; }).join('');
        return '<tr><td class="mono" style="font-size:.72rem">'+o.id+'<br><span style="color:var(--faint)">'+new Date(o.created_at).toLocaleDateString('en-IN')+'</span></td>' +
          '<td>'+((o.customer&&o.customer.name)||'—')+'<br><span style="color:var(--faint);font-size:.7rem">'+((o.customer&&o.customer.phone)||'')+'</span></td>' +
          '<td style="font-size:.75rem;max-width:200px">'+items+'</td>' +
          '<td class="mono" style="color:var(--gold-hi)">'+fmt(o.total)+'</td>' +
          '<td><select class="status-sel" data-order="'+o.id+'">'+opts+'</select></td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-order]').forEach(function(sel){
      sel.addEventListener('change', async function(){
        await A.setOrderStatus(sel.dataset.order, sel.value); loadDashboard();
      });
    });
  }

  async function loadCurators(){
    var rows = await A.allCurators();
    var wrap = document.getElementById('curWrap');
    if(!rows.length){ wrap.innerHTML = '<div class="empty-state"><div class="ico">◉</div><p>No curator applications yet</p></div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Code</th><th>Sales</th><th>Earned</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
      rows.map(function(c){
        var pill = c.status==='active'?'<span class="pill pill-live">Active</span>':
                   c.status==='pending'?'<span class="pill pill-wait">Pending</span>':
                   '<span class="pill pill-off">'+c.status+'</span>';
        var actions = '';
        if(c.status==='pending') actions = '<button class="act go" data-a="approve" data-id="'+c.id+'">Approve</button><button class="act" data-a="reject" data-id="'+c.id+'">Reject</button>';
        else if(c.status==='active') actions = '<button class="act" data-a="suspend" data-id="'+c.id+'">Suspend</button>';
        else actions = '<button class="act go" data-a="approve" data-id="'+c.id+'">Activate</button>';
        return '<tr><td>'+c.name+'<br><span style="color:var(--faint);font-size:.72rem">'+c.email+'</span></td>' +
          '<td class="mono">'+c.ref_code+'</td><td class="mono">'+c.total_sales+'</td>' +
          '<td class="mono" style="color:var(--gold-hi)">'+fmt(c.total_earned)+'</td>' +
          '<td>'+pill+'</td><td>'+actions+'</td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-a]').forEach(function(b){
      b.addEventListener('click', async function(){
        var map = { approve:'active', reject:'rejected', suspend:'suspended' };
        await A.setCuratorStatus(b.dataset.id, map[b.dataset.a]);
        loadCurators();
      });
    });
  }

  async function loadPayouts(){
    var rows = await A.allPayouts();
    var wrap = document.getElementById('payWrap');
    var pending = rows.filter(function(p){ return p.status==='requested'; });
    if(!rows.length){ wrap.innerHTML = '<div class="empty-state"><div class="ico">◇</div><p>No payout requests</p></div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th>Curator</th><th>Amount</th><th>Method</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(function(p){
        var who = p.curators ? p.curators.name+' ('+p.curators.ref_code+')' : '—';
        var pill = p.status==='paid'?'<span class="pill pill-live">✓ Paid</span>':'<span class="pill pill-wait">Requested</span>';
        var act = p.status==='requested' ? '<button class="act go" data-pay="'+p.id+'">Mark paid</button>' : '';
        return '<tr><td>'+who+'</td><td class="mono" style="color:var(--gold-hi)">'+fmt(p.amount)+'</td>' +
          '<td class="mono" style="font-size:.72rem">'+(p.method||'—')+'</td>' +
          '<td class="mono">'+new Date(p.requested_at).toLocaleDateString('en-IN')+'</td>' +
          '<td>'+pill+'</td><td>'+act+'</td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-pay]').forEach(function(b){
      b.addEventListener('click', async function(){
        if(!confirm('Mark this payout as paid? Do this only after you\'ve actually sent the money.')) return;
        await A.markPayoutPaid(b.dataset.pay); loadPayouts();
      });
    });
  }


  /* ── FEED REELS ── */
  var ffPoster = '';
  function wireFeed(){
    var drop = document.getElementById('ffDrop');
    if(!drop || drop._w) return; drop._w = true;
    drop.addEventListener('click', function(){ document.getElementById('ff-file').click(); });
    document.getElementById('ff-file').addEventListener('change', async function(e){
      if(!e.target.files[0]) return;
      drop.textContent = 'Uploading…';
      try{ ffPoster = await A.uploadImage(e.target.files[0]);
           document.getElementById('ffThumb').innerHTML = '<div class="up-thumb"><img src="'+ffPoster+'" /></div>';
      }catch(err){ alert(err.message); }
      drop.textContent = '＋ Upload a poster image'; e.target.value='';
    });
    document.getElementById('ff-save').addEventListener('click', async function(){
      var name = document.getElementById('ff-name').value.trim();
      var msg = document.getElementById('ff-msg');
      if(!name){ msg.style.color='var(--err)'; msg.textContent='Add a caption.'; return; }
      var item = { name:name, video:document.getElementById('ff-video').value.trim()||null,
        poster:ffPoster||null, shop_id:document.getElementById('ff-shop').value.trim()||null,
        sort_order:parseInt(document.getElementById('ff-order').value)||0, active:true };
      if(window._ffEditId) item.id = window._ffEditId;
      try{ var r = await A.saveFeed(item); if(r.error) throw r.error;
        msg.style.color='var(--live)'; msg.textContent='Saved ✓';
        document.getElementById('ff-clear').click(); loadFeed();
      }catch(err){ msg.style.color='var(--err)'; msg.textContent=err.message; }
    });
    document.getElementById('ff-clear').addEventListener('click', function(){
      ['ff-name','ff-video','ff-shop'].forEach(function(i){ document.getElementById(i).value=''; });
      document.getElementById('ff-order').value='0';
      ffPoster=''; window._ffEditId=null;
      document.getElementById('ffThumb').innerHTML='';
      document.getElementById('ffTitle').textContent='Add a reel';
    });
  }
  async function loadFeed(){
    wireFeed();
    var rows = await A.allFeed();
    var wrap = document.getElementById('feedWrap'); if(!wrap) return;
    if(!rows.length){ wrap.innerHTML = '<div class="empty-state"><div class="ico">▶</div><p>No reels yet — add your first above</p></div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th></th><th>Caption</th><th>Video</th><th>Order</th><th>Actions</th></tr></thead><tbody>' +
      rows.map(function(f){
        var th = f.poster ? '<img src="'+f.poster+'" style="width:40px;height:56px;border-radius:6px;object-fit:cover" />' : '<div style="width:40px;height:56px;border-radius:6px;background:var(--ink-3)"></div>';
        return '<tr><td>'+th+'</td><td>'+f.name+'</td>' +
          '<td style="font-size:.7rem;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis">'+(f.video||'—')+'</td>' +
          '<td class="mono">'+f.sort_order+'</td>' +
          '<td><button class="mini" data-fedit="'+f.id+'">Edit</button><button class="mini danger" data-fdel="'+f.id+'">Delete</button></td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-fedit]').forEach(function(b){ b.addEventListener('click', function(){
      var f = rows.find(function(z){ return z.id===b.dataset.fedit; });
      window._ffEditId = f.id; ffPoster = f.poster||'';
      document.getElementById('ff-name').value=f.name; document.getElementById('ff-video').value=f.video||'';
      document.getElementById('ff-shop').value=f.shop_id||''; document.getElementById('ff-order').value=f.sort_order;
      document.getElementById('ffThumb').innerHTML = f.poster ? '<div class="up-thumb"><img src="'+f.poster+'" /></div>' : '';
      document.getElementById('ffTitle').textContent='Edit reel';
      window.scrollTo({top:0,behavior:'smooth'});
    }); });
    wrap.querySelectorAll('[data-fdel]').forEach(function(b){ b.addEventListener('click', async function(){
      if(!confirm('Delete this reel?')) return; await A.deleteFeed(b.dataset.fdel); loadFeed();
    }); });
  }

  /* ── DROPPING NEXT ── */
  var ufImg = '';
  function wireUpcoming(){
    var drop = document.getElementById('ufDrop');
    if(!drop || drop._w) return; drop._w = true;
    drop.addEventListener('click', function(){ document.getElementById('uf-file').click(); });
    document.getElementById('uf-file').addEventListener('change', async function(e){
      if(!e.target.files[0]) return;
      drop.textContent='Uploading…';
      try{ ufImg = await A.uploadImage(e.target.files[0]);
        document.getElementById('ufThumb').innerHTML = '<div class="up-thumb"><img src="'+ufImg+'" /></div>';
      }catch(err){ alert(err.message); }
      drop.textContent='＋ Upload an image'; e.target.value='';
    });
    document.getElementById('uf-save').addEventListener('click', async function(){
      var name = document.getElementById('uf-name').value.trim();
      var msg = document.getElementById('uf-msg');
      if(!name){ msg.style.color='var(--err)'; msg.textContent='Add a name.'; return; }
      var item = { name:name, category:document.getElementById('uf-cat').value,
        teaser:document.getElementById('uf-teaser').value.trim()||null,
        est_price:document.getElementById('uf-price').value.trim()||null,
        img:ufImg||null, sort_order:parseInt(document.getElementById('uf-order').value)||0, active:true };
      if(window._ufEditId) item.id = window._ufEditId;
      try{ var r = await A.saveUpcoming(item); if(r.error) throw r.error;
        msg.style.color='var(--live)'; msg.textContent='Saved ✓';
        document.getElementById('uf-clear').click(); loadUpcoming();
      }catch(err){ msg.style.color='var(--err)'; msg.textContent=err.message; }
    });
    document.getElementById('uf-clear').addEventListener('click', function(){
      ['uf-name','uf-teaser','uf-price'].forEach(function(i){ document.getElementById(i).value=''; });
      document.getElementById('uf-order').value='0';
      ufImg=''; window._ufEditId=null;
      document.getElementById('ufThumb').innerHTML='';
      document.getElementById('ufTitle').textContent='Add an upcoming item';
    });
  }
  async function loadUpcoming(){
    wireUpcoming();
    var rows = await A.allUpcoming();
    var wrap = document.getElementById('upWrap'); if(!wrap) return;
    if(!rows.length){ wrap.innerHTML = '<div class="empty-state"><div class="ico">◔</div><p>No upcoming items — add what you\'re considering</p></div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th></th><th>Name</th><th>Est. price</th><th>Votes</th><th>Actions</th></tr></thead><tbody>' +
      rows.map(function(u){
        var th = u.img ? '<img src="'+u.img+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover" />' : '<div style="width:40px;height:40px;border-radius:6px;background:var(--ink-3)"></div>';
        return '<tr><td>'+th+'</td><td>'+u.name+'<br><span style="color:var(--faint);font-size:.68rem">'+(u.category||'')+'</span></td>' +
          '<td class="mono">'+(u.est_price||'—')+'</td><td class="mono" style="color:var(--gold-hi)">'+(u.votes||0)+'</td>' +
          '<td><button class="mini" data-uedit="'+u.id+'">Edit</button><button class="mini danger" data-udel="'+u.id+'">Delete</button></td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-uedit]').forEach(function(b){ b.addEventListener('click', function(){
      var u = rows.find(function(z){ return z.id===b.dataset.uedit; });
      window._ufEditId=u.id; ufImg=u.img||'';
      document.getElementById('uf-name').value=u.name; document.getElementById('uf-cat').value=u.category||'Gadgets';
      document.getElementById('uf-teaser').value=u.teaser||''; document.getElementById('uf-price').value=u.est_price||'';
      document.getElementById('uf-order').value=u.sort_order;
      document.getElementById('ufThumb').innerHTML = u.img ? '<div class="up-thumb"><img src="'+u.img+'" /></div>' : '';
      document.getElementById('ufTitle').textContent='Edit item';
      window.scrollTo({top:0,behavior:'smooth'});
    }); });
    wrap.querySelectorAll('[data-udel]').forEach(function(b){ b.addEventListener('click', async function(){
      if(!confirm('Delete this item?')) return; await A.deleteUpcoming(b.dataset.udel); loadUpcoming();
    }); });
  }


  /* ══════════════════════════════════════════════════════
     FULL PRODUCT EDITOR — opens with everything already in it
  ══════════════════════════════════════════════════════ */
  var edImgs = [], edId = null, edScrim = null, edPanel = null;

  function edClose(){
    if(!edPanel) return;
    edPanel.classList.remove('on'); edScrim.classList.remove('on');
    var p = edPanel, s = edScrim; edPanel = edScrim = null;
    setTimeout(function(){ if(p) p.remove(); if(s) s.remove(); }, 420);
  }

  function edRenderImgs(){
    var box = document.getElementById('edImgs');
    if(!box) return;
    box.innerHTML = edImgs.map(function(url,i){
      return '<div class="ed-img'+(i===0?' main':'')+'">' +
        '<img src="'+url+'" alt="" />' +
        '<button class="rm" data-eri="'+i+'" title="Remove">✕</button>' +
        (i>0 ? '<button class="mk" data-emk="'+i+'">Make main</button>' : '') +
      '</div>';
    }).join('') +
    '<button class="ed-add" id="edAdd"><b>+</b>Add image</button>';

    box.querySelectorAll('[data-eri]').forEach(function(b){
      b.addEventListener('click', function(){ edImgs.splice(+b.dataset.eri,1); edRenderImgs(); }); });
    box.querySelectorAll('[data-emk]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = +b.dataset.emk; var m = edImgs.splice(i,1)[0]; edImgs.unshift(m); edRenderImgs(); }); });
    document.getElementById('edAdd').addEventListener('click', function(){
      document.getElementById('edFile').click(); });
  }

  function edVideoPreview(){
    var wrap = document.getElementById('edVidPrev');
    var url = (document.getElementById('ed-video').value || '').trim();
    if(!wrap) return;
    if(!url){ wrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6E6E76;font-family:var(--f-mono);font-size:.55rem;letter-spacing:.14em">NO VIDEO</div>'; return; }
    wrap.innerHTML = (window.AscentraVideo && AscentraVideo.embedHTML)
      ? AscentraVideo.embedHTML(url)
      : '<video src="'+url+'" controls></video>';
  }

  function openEditor(p){
    p = p || {};
    edId = p.id || null;
    edImgs = (p.images && p.images.length) ? p.images.slice() : [];

    edScrim = document.createElement('div');
    edScrim.className = 'ed-scrim';
    edScrim.addEventListener('click', edClose);
    document.body.appendChild(edScrim);

    edPanel = document.createElement('aside');
    edPanel.className = 'ed';
    edPanel.innerHTML =
      '<div class="ed-head"><div><h2>'+(edId ? 'Edit product' : 'New product')+'</h2>' +
        '<div class="sub">'+(edId || 'Fill in the details below')+'</div></div>' +
        '<button class="ed-x" id="edX">✕</button></div>' +
      '<div class="ed-body">' +

        '<div class="ed-sec"><h3>Images</h3>' +
          '<input type="file" id="edFile" accept="image/*" multiple hidden />' +
          '<div class="ed-imgs" id="edImgs"></div>' +
          '<p style="color:#6E6E76;font-size:.72rem;margin:.7rem 0 0">The first image is what customers see on the shop grid.</p>' +
        '</div>' +

        '<div class="ed-sec"><h3>Video</h3>' +
          '<div class="ed-vid">' +
            '<div class="fld"><label>Video link (Instagram / YouTube / .mp4)</label>' +
              '<input id="ed-video" value="'+(p.video||'')+'" placeholder="https://..." /></div>' +
            '<div class="prev" id="edVidPrev"></div>' +
          '</div>' +
        '</div>' +

        '<div class="ed-sec"><h3>Basics</h3>' +
          '<div class="form-grid">' +
            '<div class="fld"><label>Product ID</label><input id="ed-id" value="'+(p.id||'')+'" '+(edId?'disabled':'')+' /></div>' +
            '<div class="fld"><label>Name</label><input id="ed-name" value="'+(p.name||'').replace(/"/g,'&quot;')+'" /></div>' +
          '</div>' +
          '<div class="fld" style="margin-bottom:1rem"><label>Short description</label>' +
            '<input id="ed-short" value="'+(p.short_desc||'').replace(/"/g,'&quot;')+'" /></div>' +
          '<div class="fld"><label>Full description</label>' +
            '<textarea id="ed-desc" rows="4">'+(p.description||'')+'</textarea></div>' +
        '</div>' +

        '<div class="ed-sec"><h3>Pricing &amp; stock</h3>' +
          '<div class="form-grid">' +
            '<div class="fld"><label>Price (INR)</label><input id="ed-price" type="number" value="'+(p.price||'')+'" /></div>' +
            '<div class="fld"><label>MRP (optional)</label><input id="ed-mrp" type="number" value="'+(p.mrp||'')+'" /></div>' +
            '<div class="fld"><label>Stock</label><input id="ed-stock" type="number" value="'+(p.stock!=null?p.stock:100)+'" /></div>' +
            '<div class="fld"><label>Category</label><select id="ed-cat">' +
              ['Room','Desk','Gadgets','Storage','Daily Essentials'].map(function(c){
                return '<option'+((p.category===c)?' selected':'')+'>'+c+'</option>'; }).join('') +
            '</select></div>' +
          '</div>' +
          '<div class="fld"><label>Status</label><select id="ed-status">' +
            [['active','Active (live on the shop)'],['draft','Draft (hidden)'],['paused','Paused']]
              .map(function(o){ return '<option value="'+o[0]+'"'+(((p.status||'active')===o[0])?' selected':'')+'>'+o[1]+'</option>'; }).join('') +
          '</select></div>' +
        '</div>' +

        '<div class="msg" id="edMsg"></div>' +
      '</div>' +
      '<div class="ed-foot">' +
        '<button class="save-btn" id="edSave">Save changes</button>' +
        (edId ? '<button class="mini danger" id="edDel">Delete</button>' : '') +
      '</div>';
    document.body.appendChild(edPanel);

    requestAnimationFrame(function(){ edScrim.classList.add('on'); edPanel.classList.add('on'); });

    edRenderImgs();
    edVideoPreview();
    document.getElementById('ed-video').addEventListener('change', edVideoPreview);
    document.getElementById('edX').addEventListener('click', edClose);

    document.getElementById('edFile').addEventListener('change', async function(e){
      var files = Array.prototype.slice.call(e.target.files);
      var msg = document.getElementById('edMsg');
      msg.style.color = '#A1A1A6'; msg.textContent = 'Uploading…';
      for(var i=0;i<files.length;i++){
        try{ edImgs.push(await A.uploadImage(files[i])); edRenderImgs(); }
        catch(err){ msg.style.color = 'var(--err)'; msg.textContent = err.message; }
      }
      msg.textContent = ''; e.target.value = '';
    });

    document.getElementById('edSave').addEventListener('click', async function(){
      var msg = document.getElementById('edMsg');
      var id = (edId || document.getElementById('ed-id').value.trim().toLowerCase().replace(/\s+/g,'_'));
      var name = document.getElementById('ed-name').value.trim();
      var price = parseFloat(document.getElementById('ed-price').value);
      if(!id || !name || !(price>0)){
        msg.style.color='var(--err)'; msg.textContent='Product ID, name and a valid price are required.'; return; }
      var status = document.getElementById('ed-status').value;
      msg.style.color='#A1A1A6'; msg.textContent='Saving…';
      try{
        var res = await A.saveProduct({
          id:id, name:name, price:price,
          mrp: parseFloat(document.getElementById('ed-mrp').value) || null,
          stock: parseInt(document.getElementById('ed-stock').value) || 0,
          short_desc: document.getElementById('ed-short').value.trim() || null,
          description: document.getElementById('ed-desc').value.trim() || null,
          category: document.getElementById('ed-cat').value,
          video: document.getElementById('ed-video').value.trim() || null,
          images: edImgs, status: status, active: status === 'active'
        });
        if(res.error) throw res.error;
        msg.style.color='var(--live)'; msg.textContent='Saved ✓';
        loadProducts(); loadDashboard();
        setTimeout(edClose, 550);
      }catch(err){ msg.style.color='var(--err)'; msg.textContent=err.message; }
    });

    var del = document.getElementById('edDel');
    if(del) del.addEventListener('click', async function(){
      if(!confirm('Delete "'+(p.name||edId)+'"? This cannot be undone.')) return;
      await A.deleteProduct(edId); edClose(); loadProducts(); loadDashboard();
    });
  }
  window.openEditor = openEditor;

  gate();
})();
</script>
</body>
