<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Your bag — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F6F6EC" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aim-design-tokens.css">
<link rel="stylesheet" href="css/cart.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--swan); scroll-behavior:smooth; }
body{
  background:var(--swan);
  color:var(--ink);
  font-family:var(--f-sans);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
::selection{ background:var(--ink); color:#FFFFFF; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

header#hd{
  position:sticky; top:0; z-index:90;
  background:rgba(246,246,236,.88);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid var(--line);
  transition:all .3s ease;
}
.nav{ max-width:1080px; margin:0 auto; padding:0 clamp(1.25rem,4vw,2rem); height:74px; display:flex; align-items:center; justify-content:space-between; }
.logo{
  font-family:var(--f-sans); font-size:1.2rem; font-weight:800;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
}
.logo b{ color:var(--ink); font-weight:900; }
.back{
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); font-weight:600;
  transition:color .2s; display:inline-flex; align-items:center; gap:.4em;
}
.back:hover{ color:var(--ink); }

.wrap{ max-width:1000px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) clamp(1.25rem,4vw,2rem) 5rem; }
h1{
  font-family:var(--f-sans); font-weight:800; font-size:clamp(2rem,5vw,3rem);
  letter-spacing:-.02em; color:var(--ink); margin-top:.4rem;
}
h1 em{ font-style:italic; font-weight:300; }
.eyebrow{
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--muted); font-weight:600;
}
.lede{ color:var(--muted); font-size:1rem; margin-top:.8rem; }
</style>
<script src="js/transitions.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/layout-fix.css">
</head><body>
<header id="hd"><div class="nav"><a href="index.html" class="logo">THE AIM<b>.</b></a>
  <a href="shop.html" class="back">← Keep shopping</a><span data-account style="margin-left:auto"></span></div></header>

<main class="wrap" style="max-width:900px;padding:clamp(2rem,6vw,4rem) 1.25rem">
  <span class="eyebrow">Your bag</span>
  <h1>Review your <em>order</em></h1>
  <div id="bagWrap"><p class="lede">Loading…</p></div>
</main>

<script src="js/products-data.js"></script>
<script src="js/cart.js"></script>
<script>
(function(){
  var Cart = window.AscentraCart || window.Cart;
  var wrap = document.getElementById('bagWrap');
  function money(n){ return '\u20B9' + Number(n||0).toLocaleString('en-IN'); }
  function find(id){ return PRODUCTS.filter(function(p){ return p.id===id; })[0]; }

  function render(){
    /* cart.js publishes itself as window.AscentraCart, and its public
       method is items() — there is no read(). Getting either wrong makes
       this page show an empty bag no matter what the customer added. */
    if(!Cart){ wrap.innerHTML = '<p class="lede">Cart unavailable — please refresh.</p>'; return; }
    var items = Cart.items().filter(function(i){ return find(i.id); });
    if(!items.length){
      wrap.innerHTML =
        '<div class="tcard" style="text-align:center;padding:3rem 1.4rem">' +
          '<p style="font-size:1.05rem;margin:0 0 .6rem">Your bag is empty.</p>' +
          '<p style="color:var(--faint);font-size:.88rem;margin:0 0 1.4rem">Add something you didn\u2019t know you needed.</p>' +
          '<a href="shop.html" class="tbtn" style="display:inline-block;width:auto;padding:.85rem 1.8rem;text-decoration:none">Browse all products</a>' +
        '</div>';
      return;
    }

    var subtotal = 0;
    var rows = items.map(function(i){
      var p = find(i.id);
      var line = p.price * i.qty; subtotal += line;
      var img = (p.gallery && p.gallery[0]) || p.hero || '';
      return '<div class="brow">' +
        '<a href="product.html?id='+p.id+'" class="bimg"><img src="'+img+'" alt="'+p.name+'" /></a>' +
        '<div class="binfo">' +
          '<span class="bcat">'+(p.category||'')+'</span>' +
          '<a href="product.html?id='+p.id+'" class="bname">'+p.name+'</a>' +
          '<span class="bunit">'+money(p.price)+' each</span>' +
        '</div>' +
        '<div class="bqty"><button data-dec="'+p.id+'">\u2212</button>' +
          '<span>'+i.qty+'</span><button data-inc="'+p.id+'">+</button></div>' +
        '<div class="bline">'+money(line)+'</div>' +
        '<button class="brm" data-rm="'+p.id+'" aria-label="Remove">\u2715</button>' +
      '</div>';
    }).join('');

    /* Delivery is free on every order — this must match SHIP_FEE in
       cart.js and checkout.js, and the published Shipping Policy.
       If you start charging, change it in all three places at once. */
    var ship = 0;
    var total = subtotal + ship;

    wrap.innerHTML =
      '<div class="bag-grid">' +
        '<div class="tcard blist">' + rows + '</div>' +
        '<div class="tcard bsum">' +
          '<h2 class="bsum-t">Summary</h2>' +
          '<div class="brow2"><span>Subtotal</span><b>'+money(subtotal)+'</b></div>' +
          '<div class="brow2"><span>Shipping</span><b>'+(ship? money(ship) : 'Free')+'</b></div>' +
          '<p class="bfree">Free delivery across India</p>' +
          '<div class="brow2 btot"><span>Total</span><b>'+money(total)+'</b></div>' +
          '<a href="checkout.html" class="tbtn" style="display:block;text-align:center;text-decoration:none;margin-top:1rem">Checkout</a>' +
          '<a href="shop.html" class="bcont">Keep shopping</a>' +
        '</div>' +
      '</div>';

    wrap.querySelectorAll('[data-inc]').forEach(function(b){
      b.addEventListener('click', function(){ Cart.add(b.dataset.inc, 1); render(); }); });
    wrap.querySelectorAll('[data-dec]').forEach(function(b){
      b.addEventListener('click', function(){
        var cur = Cart.items().filter(function(x){ return x.id===b.dataset.dec; })[0];
        if(cur && cur.qty > 1){ Cart.setQty(b.dataset.dec, cur.qty-1); }
        else { Cart.remove(b.dataset.dec); }
        render();
      }); });
    wrap.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){ Cart.remove(b.dataset.rm); render(); }); });
  }
  render();
})();
</script>
<style>
.bag-grid{ display:grid; grid-template-columns:1fr; gap:1.4rem; margin-top:2rem; }
@media (min-width:860px){ .bag-grid{ grid-template-columns:1.6fr .9fr; align-items:start; } }

.tcard{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  box-shadow:var(--sh-card), inset 0 1px 0 #FFFFFF;
}
.blist{ padding:.8rem 1.4rem; }

.brow{
  display:grid; grid-template-columns:68px 1fr auto auto auto; gap:1rem; align-items:center;
  padding:1.1rem 0; border-bottom:1px solid var(--line);
}
.brow:last-child{ border-bottom:none; }
.bimg{
  width:68px; height:68px; border-radius:12px; overflow:hidden;
  background:var(--swan-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
}
.bimg img{ width:100%; height:100%; object-fit:cover; }

.binfo{ min-width:0; }
.bcat{
  display:block; font-family:var(--f-mono); font-size:.54rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:.2rem;
}
.bname{
  display:block; font-size:.95rem; font-weight:700; color:var(--ink); text-decoration:none;
  line-height:1.3; overflow-wrap:anywhere; transition:color .2s;
}
.bname:hover{ color:var(--ink-soft); }
.bunit{
  display:block; font-family:var(--f-mono); font-size:.66rem; color:var(--muted); margin-top:.25rem;
}

.bqty{
  display:flex; align-items:center; gap:.2rem; border:1px solid var(--line);
  border-radius:999px; padding:.15rem .35rem; background:rgba(255,255,255,.8);
}
.bqty button{
  background:none; border:none; color:var(--ink); cursor:pointer; width:28px; height:28px;
  border-radius:50%; font-size:1rem; display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.bqty button:hover{ background:rgba(0,7,45,.06); }
.bqty span{ min-width:24px; text-align:center; font-family:var(--f-mono); font-size:.82rem; font-weight:700; color:var(--ink); }

.bline{
  font-family:var(--f-mono); font-weight:700; font-size:.95rem; color:var(--ink); white-space:nowrap;
}
.brm{
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:.85rem; padding:.4rem;
  border-radius:50%; transition:all .2s;
}
.brm:hover{ color:#E08A7A; background:rgba(224,138,122,.1); }

.bsum{ padding:1.6rem; position:sticky; top:5.5rem; }
.bsum-t{
  font-family:var(--f-sans); font-weight:800; font-size:1.15rem; color:var(--ink); margin:0 0 1.2rem;
  letter-spacing:-.01em;
}
.brow2{
  display:flex; justify-content:space-between; gap:1rem; padding:.55rem 0; font-size:.9rem; color:var(--muted);
}
.brow2 b{ color:var(--ink); font-family:var(--f-mono); font-weight:600; }
.btot{
  border-top:1px solid var(--line); margin-top:.6rem; padding-top:1rem; font-size:1.05rem;
}
.btot span{ font-weight:700; color:var(--ink); }
.btot b{ font-family:var(--f-mono); font-size:1.3rem; font-weight:800; color:var(--ink); }
.bfree{
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.06em; color:var(--live);
  margin:.4rem 0 0; font-weight:600; display:flex; align-items:center; gap:.3em;
}
.bcont{
  display:block; text-align:center; margin-top:1rem; font-family:var(--f-mono); font-size:.62rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-decoration:none; font-weight:600;
  transition:color .2s;
}
.bcont:hover{ color:var(--ink); }

.tbtn{
  display:block; width:100%; text-align:center;
  background:var(--ink); color:#FFFFFF; border:1px solid var(--ink);
  border-radius:999px; font-family:var(--f-mono); font-size:.74rem; letter-spacing:.14em;
  text-transform:uppercase; font-weight:700; padding:.95rem 1.6rem;
  box-shadow:0 10px 24px -6px rgba(0,7,45,.3); transition:all .2s ease; cursor:pointer;
}
.tbtn:hover{ background:var(--ink-soft); transform:translateY(-1px); box-shadow:0 14px 28px -6px rgba(0,7,45,.4); }

@media (max-width:640px){
  .brow{ grid-template-columns:56px 1fr auto; grid-template-areas:"img info rm" "img qty line"; gap:.7rem; }
  .bimg{ grid-area:img; width:56px; height:56px; }
  .binfo{ grid-area:info; }
  .bqty{ grid-area:qty; }
  .bline{ grid-area:line; text-align:right; }
  .brm{ grid-area:rm; align-self:start; }
  .bsum{ position:static; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script src="js/account.js"></script>
<script src="js/support.js"></script>
</body>
</html>
