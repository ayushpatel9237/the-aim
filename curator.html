<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Curator Portal — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF"
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050818; --ink-2:#0A0F26; --ink-3:#080C1F;
  --line-1:#1A2142; --line-soft:#111735;
  --text:#FFF1E2; --muted:#8E96B8; --faint:#5F678E;
  --gold:#E6CBA8; --gold-hi:#F0DCC0; --live:#5FA88C; --err:#A98F6B;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Space Grotesk",system-ui,sans-serif; --f-mono:"Space Mono",monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#050818; background-image:radial-gradient(1200px 700px at 50% -20%, rgba(26,33,66,.42), transparent 70%); background-attachment:fixed; color:var(--text); font-family:var(--f-body); line-height:1.6; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; } img{ display:block; max-width:100%; }
button,input{ font:inherit; } button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
::selection{ background:var(--gold); color:var(--ink); }

header{ position:sticky; top:0; z-index:50; background:transparent; transition:background .35s ease, border-color .35s ease, backdrop-filter .35s ease; border-bottom:1px solid transparent; }header.stuck{ background:rgba(5,8,24,.72); backdrop-filter:saturate(160%) blur(16px); -webkit-backdrop-filter:saturate(160%) blur(16px); border-bottom-color:rgba(230,203,168,.12); }
.nav{ max-width:1000px; margin:0 auto; padding:0 1.4rem; height:72px; display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:var(--f-display); font-size:1.15rem; letter-spacing:.3em; text-transform:uppercase; }
.logo b{ color:var(--gold); font-weight:400; }
.logo small{ font-family:var(--f-mono); font-size:.55rem; letter-spacing:.24em; color:var(--muted); display:block; margin-top:2px; }
.nav-right{ display:flex; align-items:center; gap:1.2rem; font-family:var(--f-mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.nav-right a:hover, .nav-right button:hover{ color:var(--gold-hi); }
.nav-right button{ background:none; border:none; color:var(--muted); }

.wrap{ max-width:1000px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) 1.4rem 5rem; }
.eyebrow{ font-family:var(--f-mono); font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); }
h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(1.9rem,4.5vw,2.8rem); letter-spacing:-.01em; margin-top:.8rem; }
h1 em{ font-style:italic; font-weight:300; color:var(--gold-hi); }
.sub{ color:var(--muted); margin-top:.8rem; max-width:34rem; }

/* auth card */
.auth-card{ max-width:420px; margin:2.5rem auto 0; background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:2rem; }
.tabs{ display:flex; gap:.5rem; margin-bottom:1.6rem; }
.tab{ flex:1; text-align:center; padding:.7rem; border-radius:9px; font-family:var(--f-mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line-1); background:transparent; transition:all .3s; }
.tab.on{ background:#E6CBA8; color:#050818; border-color:transparent; font-weight:700; }
.field{ margin-bottom:1rem; }
label{ display:block; font-family:var(--f-mono); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.4rem; }
input{ width:100%; background:var(--ink-3); border:1px solid var(--line-1); border-radius:9px; color:var(--text); font-size:.92rem; padding:.8rem 1rem; outline:none; transition:border-color .3s; }
input:focus{ border-color:var(--gold); }
.primary-btn{ width:100%; margin-top:.5rem; padding:1rem; border:none; border-radius:999px; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:#050818; background:#E6CBA8; transition:transform .3s; }
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:disabled{ opacity:.6; transform:none; }
.msg{ font-family:var(--f-mono); font-size:.68rem; text-align:center; margin-top:1rem; min-height:1em; }
.msg.err{ color:var(--err); } .msg.ok{ color:var(--live); }

/* dashboard */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-top:2.5rem; }
@media (max-width:700px){ .stats{ grid-template-columns:repeat(2,1fr); } }
.stat{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:14px; padding:1.3rem; }
.stat .l{ font-family:var(--f-mono); font-size:.56rem; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
.stat .v{ font-family:var(--f-display); font-size:1.9rem; margin-top:.5rem; color:var(--gold-hi); }
.stat .v small{ font-size:1rem; color:var(--muted); }

.panel{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:1.6rem; margin-top:1.5rem; }
.panel h2{ font-family:var(--f-display); font-weight:400; font-size:1.25rem; margin-bottom:1.1rem; }
.share{ display:flex; gap:.8rem; flex-wrap:wrap; }
.share-box{ flex:1; min-width:200px; background:var(--ink-3); border:1px solid var(--line-1); border-radius:11px; padding:1rem; }
.share-box .k{ font-family:var(--f-mono); font-size:.54rem; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
.share-box .val{ font-family:var(--f-mono); font-size:.9rem; color:var(--gold-hi); margin-top:.4rem; word-break:break-all; }
.copy-btn{ margin-top:.7rem; font-family:var(--f-mono); font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text); background:transparent; border:1px solid var(--line-1); border-radius:999px; padding:.45rem .9rem; transition:all .3s; }
.copy-btn:hover{ border-color:var(--gold); color:var(--gold-hi); }

table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-family:var(--f-mono); font-size:.55rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); padding:.6rem .5rem; border-bottom:1px solid var(--line-1); }
td{ padding:.75rem .5rem; border-bottom:1px solid var(--line-soft); font-size:.85rem; }
td.mono{ font-family:var(--f-mono); }
.pill{ font-family:var(--f-mono); font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; padding:.3em .7em; border-radius:999px; }
.pill-live{ color:var(--live); border:1px solid rgba(106,168,143,.4); }
.pill-wait{ color:var(--gold-hi); border:1px solid rgba(201,161,95,.4); }
.empty-note{ text-align:center; color:var(--faint); font-family:var(--f-mono); font-size:.66rem; padding:2rem; }

.status-banner{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:2.5rem; text-align:center; margin-top:2.5rem; max-width:520px; margin-left:auto; margin-right:auto; }
.status-banner .icon{ font-size:2rem; margin-bottom:1rem; }
.status-banner h2{ font-family:var(--f-display); font-weight:400; font-size:1.4rem; }
.status-banner p{ color:var(--muted); margin-top:.8rem; font-size:.9rem; }

.not-setup{ max-width:560px; margin:3rem auto; background:var(--ink-2); border:1px solid var(--err); border-radius:16px; padding:2rem; }
.not-setup h2{ font-family:var(--f-display); font-weight:400; color:var(--err); }
.not-setup code{ font-family:var(--f-mono); font-size:.8rem; background:var(--ink-3); padding:.2em .5em; border-radius:4px; color:var(--gold-hi); }
.not-setup ol{ margin:1rem 0 0 1.2rem; color:var(--muted); font-size:.88rem; line-height:1.9; }

.or-divider{ display:flex; align-items:center; gap:1rem; margin:1.2rem 0; }
.or-divider::before, .or-divider::after{ content:""; flex:1; height:1px; background:var(--line-1); }
.or-divider span{ font-family:var(--f-mono); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
.google-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:.7rem;
  padding:.9rem; border-radius:999px; cursor:pointer;
  background:#fff; color:#0A0F26; border:none;
  font-family:var(--f-body); font-size:.9rem; font-weight:500; transition:transform .3s, box-shadow .3s;
}
.google-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(0,0,0,.5); }
.google-btn svg{ flex:none; }

.dash-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:1.5rem; flex-wrap:wrap; }
.dash-head .sub{ color:var(--muted); font-size:.86rem; margin-top:.6rem; }
.tier-badge{ text-align:right; border:1px solid var(--gold); border-radius:14px; padding:.9rem 1.3rem; background:rgba(201,161,95,.07); }
.tier-badge .t{ display:block; font-family:var(--f-display); font-size:1.3rem; color:var(--gold-hi); }
.tier-badge .s{ display:block; font-family:var(--f-mono); font-size:.52rem; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin-top:.25rem; }
.how-card{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:1.5rem; margin-top:1.5rem; }
.how-t{ font-family:var(--f-mono); font-size:.58rem; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); margin-bottom:1rem; }
.how-steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; }
@media (max-width:800px){ .how-steps{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:480px){ .how-steps{ grid-template-columns:1fr; } }
.how-s{ font-size:.82rem; color:var(--muted); line-height:1.5; }
.how-s b{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; border:1px solid var(--gold); color:var(--gold-hi); font-family:var(--f-mono); font-size:.6rem; margin-right:.5rem; }
.empty-state{ text-align:center; padding:2.5rem 1rem; }
.empty-state .ico{ font-size:1.8rem; opacity:.35; margin-bottom:.7rem; }
.empty-state p{ color:var(--faint); font-family:var(--f-mono); font-size:.66rem; letter-spacing:.1em; }

/* ══════════════════════════════════════════════════════════
   CURATOR WORKSPACE — light, clean, professional
   A place to work, not a shop window.
══════════════════════════════════════════════════════════ */
:root{
  --ink:#FFFFFF; --ink-2:#FFFFFF; --ink-3:#F6F7F9;
  --line-1:#E3E6EC; --line-soft:#EDEFF3;
  --text:#0E1320; --muted:#5B6478; --faint:#8A93A6;
  --gold:#0E1320; --gold-hi:#2C3550;
  --live:#0F8A5F; --err:#C0392B;
}
body{ background:#FFFFFF !important; background-image:none !important; color:#0E1320 !important; }
header{ background:rgba(255,255,255,.92) !important; border-bottom:1px solid #E3E6EC !important;
        backdrop-filter:saturate(160%) blur(12px) !important; }
header.stuck{ background:rgba(255,255,255,.96) !important; border-bottom-color:#E3E6EC !important; }
.logo, .logo b, h1, h2, h3{ color:#0E1320 !important; }
h1 em, h2 em{ color:#4A5570 !important; font-style:italic; }
.eyebrow, .sub, .l, label{ color:#8A93A6 !important; }
p, .desc{ color:#5B6478 !important; }

/* cards: white with a hairline, soft lift */
.card, .panel, .stat, .how-card, .card-f{
  background:#FFFFFF !important; border:1px solid #E3E6EC !important;
  border-radius:12px !important; color:#0E1320 !important;
  box-shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.10) !important;
  backdrop-filter:none !important;
}
.stat .v{ color:#0E1320 !important; }
.tier-badge{ background:#F6F7F9 !important; border-color:#D8DCE5 !important; }
.tier-badge .t{ color:#0E1320 !important; }

/* inputs */
input, select, textarea{
  background:#FFFFFF !important; border:1px solid #D8DCE5 !important; color:#0E1320 !important;
  border-radius:9px !important;
}
input:focus, textarea:focus{ border-color:#0E1320 !important; box-shadow:0 0 0 3px rgba(14,19,32,.08) !important; }

/* buttons */
.primary-btn, .save-btn, .btn-gold{
  background:#0E1320 !important; color:#FFFFFF !important; border:none !important; border-radius:9px !important;
}
.primary-btn:hover, .save-btn:hover{ background:#2C3550 !important; }
.mini, .btn-ghost, .sh-bag{
  background:#FFFFFF !important; border:1px solid #D8DCE5 !important; color:#0E1320 !important; border-radius:8px !important;
}
.mini:hover{ background:#F6F7F9 !important; }
.google-btn{ background:#FFFFFF !important; color:#0E1320 !important; border:1px solid #D8DCE5 !important; }
.google-btn:hover{ background:#F6F7F9 !important; box-shadow:none !important; }

/* tables */
table th{ color:#8A93A6 !important; border-bottom:1px solid #E3E6EC !important; }
table td{ border-bottom:1px solid #EDEFF3 !important; color:#0E1320 !important; }

/* pills */
.pill{ background:#F6F7F9 !important; border:1px solid #E3E6EC !important; backdrop-filter:none !important; }
.pill-live{ background:#E8F6EF !important; color:#0F8A5F !important; border-color:#BFE6D5 !important; }
.pill-wait{ background:#FEF6E7 !important; color:#8A6100 !important; border-color:#F3E0BA !important; }
.pill-off{ background:#F6F7F9 !important; color:#5B6478 !important; }
.empty-state p, .empty-note{ color:#8A93A6 !important; }
.or-divider span{ color:#8A93A6 !important; }
.or-divider::before, .or-divider::after{ background:#E3E6EC !important; }
</style>
