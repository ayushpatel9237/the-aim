<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Checkout — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F6F6EC" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aim-design-tokens.css">
<link rel="stylesheet" href="css/cart.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--swan); scroll-behavior:smooth; }
body{
  background:var(--swan);
  color:var(--ink);
  font-family:var(--f-sans);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; cursor:pointer; }
::selection{ background:var(--ink); color:#FFFFFF; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

header#hd{
  position:sticky; top:0; z-index:90;
  background:rgba(246,246,236,.88);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid var(--line);
  transition:all .3s ease;
}
.nav{ max-width:1120px; margin:0 auto; padding:0 clamp(1.25rem,4vw,2rem); height:74px; display:flex; align-items:center; justify-content:space-between; }
.logo{
  font-family:var(--f-sans); font-size:1.2rem; font-weight:800;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
}
.logo b{ color:var(--ink); font-weight:900; }
.secure{
  font-family:var(--f-mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); font-weight:600; display:flex; align-items:center; gap:.5em;
  background:rgba(255,255,255,.75); padding:.4em .85em; border-radius:999px; border:1px solid var(--line);
}
.secure::before{ content:"🔒"; font-size:.85em; }

.wrap{ max-width:1120px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) clamp(1.25rem,4vw,2rem) 5rem; }
</style>
<script src="js/transitions.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/layout-fix.css">
</head>
<body>

<header id="hd">
  <div class="nav">
    <a href="index.html" class="logo">THE AIM<b>.</b></a>
    <span class="secure">Secure checkout</span>
    <span data-account style="margin-left:auto"></span>
  </div>
</header>

<div class="wrap" id="page"></div>

<script src="js/products-data.js"></script>
<script src="js/cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<!-- Without this, checkout prices come from the static products-data.js
     while create-order charges the live database price. A price edited in
     the admin would mean the customer is charged a different amount than
     the one they were shown. -->
<script src="js/live-products.js"></script>
<script src="js/referral.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/support.js"></script>
</body>
</html>
