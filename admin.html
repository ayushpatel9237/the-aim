<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0c0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0c0d; --ink-2:#111113; --ink-3:#16161a;
  --line-1:#2a2a2e; --line-soft:#1e1e21;
  --text:#ececee; --muted:#9a9a9f; --faint:#6a6a70;
  --gold:#c9a15f; --gold-hi:#e7c98a; --live:#6aa88f; --err:#e0866a;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Space Grotesk",system-ui,sans-serif; --f-mono:"Space Mono",monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:radial-gradient(1400px 900px at 50% -25%, #1c1c22, var(--ink) 62%) fixed; color:var(--text); font-family:var(--f-body); line-height:1.6; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; } button,input{ font:inherit; } button{ cursor:pointer; }
header{ border-bottom:1px solid var(--line-soft); }
.nav{ max-width:1100px; margin:0 auto; padding:0 1.4rem; height:72px; display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:var(--f-display); font-size:1.15rem; letter-spacing:.3em; text-transform:uppercase; }
.logo b{ color:var(--gold); font-weight:400; }
.logo small{ font-family:var(--f-mono); font-size:.55rem; letter-spacing:.24em; color:var(--muted); display:block; margin-top:2px; }
.nav-right{ font-family:var(--f-mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); display:flex; gap:1.2rem; }
.nav-right button{ background:none; border:none; color:var(--muted); }
.nav-right button:hover, .nav-right a:hover{ color:var(--gold-hi); }
.wrap{ max-width:1100px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) 1.4rem 5rem; }
h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(1.8rem,4vw,2.5rem); margin-bottom:.4rem; }
h1 em{ font-style:italic; font-weight:300; color:var(--gold-hi); }
.panel{ background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:1.6rem; margin-top:1.8rem; }
.panel h2{ font-family:var(--f-display); font-weight:400; font-size:1.25rem; margin-bottom:1.1rem; }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-family:var(--f-mono); font-size:.55rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); padding:.6rem .5rem; border-bottom:1px solid var(--line-1); }
td{ padding:.75rem .5rem; border-bottom:1px solid var(--line-soft); font-size:.85rem; vertical-align:middle; }
td.mono{ font-family:var(--f-mono); }
.pill{ font-family:var(--f-mono); font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; padding:.3em .7em; border-radius:999px; }
.pill-live{ color:var(--live); border:1px solid rgba(106,168,143,.4); }
.pill-wait{ color:var(--gold-hi); border:1px solid rgba(201,161,95,.4); }
.pill-off{ color:var(--faint); border:1px solid var(--line-1); }
.act{ font-family:var(--f-mono); font-size:.55rem; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line-1); background:transparent; color:var(--text); border-radius:999px; padding:.4rem .8rem; margin-right:.4rem; transition:all .3s; }
.act:hover{ border-color:var(--gold); color:var(--gold-hi); }
.act.go{ background:linear-gradient(180deg,#E9CD8D,var(--gold)); color:#141006; border-color:transparent; font-weight:700; }
.empty-note{ text-align:center; color:var(--faint); font-family:var(--f-mono); font-size:.66rem; padding:2rem; }
.gate{ max-width:460px; margin:3rem auto; background:var(--ink-2); border:1px solid var(--line-soft); border-radius:16px; padding:2rem; text-align:center; }
.gate h2{ font-family:var(--f-display); font-weight:400; }
.gate p{ color:var(--muted); margin-top:.8rem; font-size:.9rem; }
.gate input{ width:100%; background:var(--ink-3); border:1px solid var(--line-1); border-radius:9px; color:var(--text); padding:.8rem 1rem; margin-top:1rem; outline:none; }
.gate button{ width:100%; margin-top:1rem; padding:.95rem; border:none; border-radius:999px; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:#141006; background:linear-gradient(180deg,#E9CD8D,var(--gold)); }
.msg{ font-family:var(--f-mono); font-size:.66rem; margin-top:1rem; color:var(--err); }
</style>
</head>
<body>
<header><div class="nav">
  <a href="index.html" class="logo">THE AIM<b>.</b><small>Admin</small></a>
  <div class="nav-right" id="navRight"><a href="index.html">← Store</a></div>
</div></header>
<div class="wrap" id="page"><div class="empty-note">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script>
(function(){
  var page = document.getElementById('page');
  var navRight = document.getElementById('navRight');
  var A = window.Ascentra;
  var fmt = function(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); };

  if(!A || !A.configured()){
    page.innerHTML = '<div class="gate"><h2>Not connected</h2><p>Add your Supabase keys to <b>js/config.js</b> first.</p></div>';
    return;
  }

  async function gate(){
    var user = await A.currentUser();
    if(!user){ renderLogin(); return; }
    var role = (user.app_metadata && user.app_metadata.role) || '';
    if(role !== 'admin'){
      page.innerHTML = '<div class="gate"><h2>Not authorised</h2>' +
        '<p>This account isn\'t an admin. In Supabase SQL editor run:</p>' +
        '<p style="font-family:var(--f-mono);font-size:.72rem;color:var(--gold-hi);margin-top:.8rem;word-break:break-all">update auth.users set raw_app_meta_data = raw_app_meta_data || \'{"role":"admin"}\' where email=\''+user.email+'\';</p>' +
        '<button onclick="location.reload()" style="margin-top:1.4rem">I\'ve done it — reload</button></div>';
      setSignOut(); return;
    }
    renderAdmin(); setSignOut();
  }
  function setSignOut(){
    navRight.innerHTML = '<a href="index.html">← Store</a><button id="so">Sign out</button>';
    document.getElementById('so').addEventListener('click', async function(){ await A.signOut(); location.reload(); });
  }
  function renderLogin(){
    page.innerHTML = '<div class="gate"><h2>Admin login</h2>' +
      '<input id="e" type="email" placeholder="Email" /><input id="p" type="password" placeholder="Password" />' +
      '<button id="go">Log in</button><div class="msg" id="m"></div></div>';
    document.getElementById('go').addEventListener('click', async function(){
      var r = await A.signIn(document.getElementById('e').value.trim(), document.getElementById('p').value);
      if(r.error){ document.getElementById('m').textContent = r.error.message; return; }
      gate();
    });
  }

  async function renderAdmin(){
    page.innerHTML = '<h1>Admin <em>dashboard</em></h1>' +
      '<div class="panel"><h2>Curators</h2><div id="curWrap"><div class="empty-note">Loading…</div></div></div>' +
      '<div class="panel"><h2>Payout requests</h2><div id="payWrap"><div class="empty-note">Loading…</div></div></div>';
    loadCurators(); loadPayouts();
  }

  async function loadCurators(){
    var rows = await A.allCurators();
    var wrap = document.getElementById('curWrap');
    if(!rows.length){ wrap.innerHTML = '<div class="empty-note">No curators yet.</div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Code</th><th>Sales</th><th>Earned</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
      rows.map(function(c){
        var pill = c.status==='active'?'<span class="pill pill-live">Active</span>':
                   c.status==='pending'?'<span class="pill pill-wait">Pending</span>':
                   '<span class="pill pill-off">'+c.status+'</span>';
        var actions = '';
        if(c.status==='pending') actions = '<button class="act go" data-a="approve" data-id="'+c.id+'">Approve</button><button class="act" data-a="reject" data-id="'+c.id+'">Reject</button>';
        else if(c.status==='active') actions = '<button class="act" data-a="suspend" data-id="'+c.id+'">Suspend</button>';
        else actions = '<button class="act go" data-a="approve" data-id="'+c.id+'">Activate</button>';
        return '<tr><td>'+c.name+'<br><span style="color:var(--faint);font-size:.72rem">'+c.email+'</span></td>' +
          '<td class="mono">'+c.ref_code+'</td><td class="mono">'+c.total_sales+'</td>' +
          '<td class="mono" style="color:var(--gold-hi)">'+fmt(c.total_earned)+'</td>' +
          '<td>'+pill+'</td><td>'+actions+'</td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-a]').forEach(function(b){
      b.addEventListener('click', async function(){
        var map = { approve:'active', reject:'rejected', suspend:'suspended' };
        await A.setCuratorStatus(b.dataset.id, map[b.dataset.a]);
        loadCurators();
      });
    });
  }

  async function loadPayouts(){
    var rows = await A.allPayouts();
    var wrap = document.getElementById('payWrap');
    var pending = rows.filter(function(p){ return p.status==='requested'; });
    if(!rows.length){ wrap.innerHTML = '<div class="empty-note">No payout requests.</div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th>Curator</th><th>Amount</th><th>Method</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(function(p){
        var who = p.curators ? p.curators.name+' ('+p.curators.ref_code+')' : '—';
        var pill = p.status==='paid'?'<span class="pill pill-live">✓ Paid</span>':'<span class="pill pill-wait">Requested</span>';
        var act = p.status==='requested' ? '<button class="act go" data-pay="'+p.id+'">Mark paid</button>' : '';
        return '<tr><td>'+who+'</td><td class="mono" style="color:var(--gold-hi)">'+fmt(p.amount)+'</td>' +
          '<td class="mono" style="font-size:.72rem">'+(p.method||'—')+'</td>' +
          '<td class="mono">'+new Date(p.requested_at).toLocaleDateString('en-IN')+'</td>' +
          '<td>'+pill+'</td><td>'+act+'</td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-pay]').forEach(function(b){
      b.addEventListener('click', async function(){
        if(!confirm('Mark this payout as paid? Do this only after you\'ve actually sent the money.')) return;
        await A.markPayoutPaid(b.dataset.pay); loadPayouts();
      });
    });
  }

  gate();
})();
</script>
</body>
</html>
