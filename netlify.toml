[build]
  publish = "."

# ══════════════════════════════════════════════════════════════
#  BLOCK SOURCE / CONFIG FILES
#
#  force = true is the important part. Without it Netlify serves
#  any file that actually exists and never reaches the redirect —
#  which is why /security-hardening.sql was still downloading.
#
#  Netlify's splat is only reliable at the END of a path, so
#  "/*.sql" does not match what you would expect. Blocking whole
#  folders is both simpler and safer: move the files into /sql and
#  /docs and everything inside is covered, including files you add
#  later and forget about.
# ══════════════════════════════════════════════════════════════
[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# belt and braces: the loose files, by exact name, in case one is
# left behind in the root during a deploy
[[redirects]]
  from = "/security-hardening.sql"
  to = "/404.html"
  status = 404
  force = true
