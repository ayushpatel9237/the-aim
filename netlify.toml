# ══════════════════════════════════════════════════════════════
#  CACHING
# ══════════════════════════════════════════════════════════════
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# never cache HTML, so a deploy shows up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# never cache JS either — a stale checkout.js cost hours of
# debugging once; better a re-download than a wrong file
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ══════════════════════════════════════════════════════════════
#  SECURITY HEADERS
# ══════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    # stop your site being embedded in someone else's page (clickjacking)
    X-Frame-Options = "SAMEORIGIN"
    # stop browsers guessing file types (MIME sniffing attacks)
    X-Content-Type-Options = "nosniff"
    # don't leak your URLs to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # force HTTPS for a year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # the page may not use hardware it has no business using
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), accelerometer=(), payment=(self)"
    # stop other origins reading your pages via popups
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Content Security Policy — where code, styles and data may come from.
    # frame-ancestors is the modern replacement for X-Frame-Options;
    # both are set so older browsers are covered too.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://checkout.razorpay.com https://www.youtube-nocookie.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.instagram.com https://www.facebook.com https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# the admin panel is yours alone — never let it be framed or indexed
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/curator.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
