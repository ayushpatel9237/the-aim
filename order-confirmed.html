<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Order Confirmed — The AIM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F6F6EC" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aim-design-tokens.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--swan); scroll-behavior:smooth; }
body{
  background:var(--swan);
  color:var(--ink);
  font-family:var(--f-sans);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
button{ font:inherit; cursor:pointer; }
::selection{ background:var(--ink); color:#FFFFFF; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

header#hd{
  position:sticky; top:0; z-index:90;
  background:rgba(246,246,236,.88);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid var(--line);
  transition:all .3s ease;
}
.nav{ max-width:760px; margin:0 auto; padding:0 1.4rem; height:74px; display:flex; align-items:center; }
.logo{
  font-family:var(--f-sans); font-size:1.2rem; font-weight:800;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
}
.logo b{ color:var(--ink); font-weight:900; }

.wrap{ max-width:680px; margin:0 auto; padding:clamp(2.5rem,6vw,4.5rem) 1.4rem 5rem; }

.tick-wrap{ display:flex; align-items:center; gap:1.2rem; margin-bottom:1.4rem; }
.tick{
  width:64px; height:64px; border-radius:50%;
  background:linear-gradient(135deg, #10B981, #059669);
  display:flex; align-items:center; justify-content:center;
  color:#FFFFFF; font-size:1.8rem; font-weight:800;
  box-shadow:0 12px 28px -6px rgba(16,185,129,.45);
  animation:pop .5s cubic-bezier(.34,1.4,.64,1);
  flex:none;
}
@keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }

.badge-confirmed{
  display:inline-flex; align-items:center; gap:.5rem;
  background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.3);
  color:#047857; font-family:var(--f-mono); font-size:.68rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  padding:.35rem .85rem; border-radius:999px;
}
.badge-dot{ width:7px; height:7px; border-radius:50%; background:#10B981; animation:pulse 2s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.4; transform:scale(.8); } }

h1{
  font-family:var(--f-sans); font-weight:800; font-size:clamp(2rem,5vw,2.8rem);
  letter-spacing:-.025em; color:var(--ink); line-height:1.15;
}
.lead{ color:var(--muted); margin-top:.7rem; font-size:1.02rem; }

.ord-bar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.8rem;
  margin-top:1.4rem; background:rgba(255,255,255,.8);
  border:1px solid var(--line); border-radius:16px; padding:.75rem 1.2rem;
  box-shadow:var(--sh-chip);
}
.ord-id{
  font-family:var(--f-mono); font-size:.82rem; letter-spacing:.08em; font-weight:700;
  color:var(--ink);
}
.copy-btn{
  font-family:var(--f-mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase;
  background:rgba(0,7,45,.06); border:1px solid var(--line); border-radius:999px;
  padding:.35rem .85rem; font-weight:600; color:var(--ink); transition:all .2s;
}
.copy-btn:hover{ background:var(--ink); color:#FFFFFF; }

/* WhatsApp direct track card */
.wa-card{
  background:linear-gradient(135deg, rgba(37,211,102,.12) 0%, rgba(255,255,255,.9) 100%);
  border:1px solid rgba(37,211,102,.35);
  border-radius:20px; padding:1.4rem; margin-top:1.6rem;
  display:flex; align-items:center; justify-content:space-between; gap:1.2rem; flex-wrap:wrap;
  box-shadow:0 12px 30px -10px rgba(37,211,102,.2);
}
.wa-left{ display:flex; align-items:center; gap:1rem; flex:1; min-width:240px; }
.wa-icon{
  width:48px; height:48px; border-radius:50%;
  background:#25D366; display:flex; align-items:center; justify-content:center;
  color:#FFFFFF; flex:none; box-shadow:0 6px 16px rgba(37,211,102,.4);
}
.wa-title{ font-family:var(--f-sans); font-weight:800; font-size:1.05rem; color:var(--ink); line-height:1.2; }
.wa-sub{ font-size:.84rem; color:var(--muted); margin-top:.2rem; }
.wa-btn{
  font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
  background:#25D366; color:#FFFFFF; padding:.85rem 1.6rem; border-radius:999px;
  display:inline-flex; align-items:center; gap:.5rem; transition:all .25s ease;
  box-shadow:0 8px 20px -4px rgba(37,211,102,.45); border:none; text-decoration:none;
}
.wa-btn:hover{ background:#1EBE5D; transform:translateY(-2px); box-shadow:0 12px 24px -4px rgba(37,211,102,.55); }

.card{
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  padding:1.6rem; margin-top:1.6rem;
  box-shadow:var(--sh-card), inset 0 1px 0 #FFFFFF;
}
.card h2{
  font-family:var(--f-sans); font-weight:800; font-size:1.15rem; color:var(--ink);
  letter-spacing:-.01em; margin-bottom:1.1rem;
}
.o-row{
  display:grid; grid-template-columns:52px 1fr auto; gap:1rem; align-items:center;
  padding:.75rem 0; border-bottom:1px solid var(--line);
}
.o-row:last-of-type{ border-bottom:none; }
.o-row img{ width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--swan-2); border:1px solid var(--line); }
.o-nm{ font-size:.9rem; font-weight:700; color:var(--ink); }
.o-q{ font-family:var(--f-mono); font-size:.62rem; color:var(--muted); margin-top:.2rem; }
.o-pr{ font-family:var(--f-mono); font-size:.88rem; font-weight:700; color:var(--ink); }
.o-total{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-top:1rem; padding-top:.9rem; border-top:1px solid var(--line); font-family:var(--f-mono);
}
.o-total span:first-child{ color:var(--ink); font-weight:700; font-size:.92rem; }
.o-total span:last-child{ color:var(--ink); font-weight:800; font-size:1.3rem; }

.addr{ font-size:.9rem; color:var(--muted); line-height:1.7; }
.addr b{ color:var(--ink); font-weight:700; }

.steps{ display:flex; flex-direction:column; gap:.9rem; margin-top:.4rem; }
.step{ display:flex; gap:.9rem; align-items:flex-start; font-size:.9rem; color:var(--muted); }
.step .n{
  font-family:var(--f-mono); font-size:.62rem; font-weight:700; color:var(--ink);
  background:rgba(0,7,45,.06); border:1px solid var(--line); border-radius:50%;
  width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex:none;
}
.step b{ color:var(--ink); font-weight:700; }

.cta{ display:flex; gap:1rem; flex-wrap:wrap; margin-top:2.2rem; }
.btn{
  font-family:var(--f-mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  padding:1rem 2rem; border-radius:999px; transition:all .25s ease; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem; text-decoration:none;
}
.btn-solid{
  background:var(--ink); color:#FFFFFF; border:1px solid var(--ink);
  box-shadow:0 10px 24px -6px rgba(0,7,45,.3);
}
.btn-solid:hover{ background:var(--ink-soft); transform:translateY(-1px); box-shadow:0 14px 28px -6px rgba(0,7,45,.4); }
.btn-line{
  border:1px solid var(--line); background:rgba(255,255,255,.8); color:var(--ink);
  box-shadow:var(--sh-chip);
}
.btn-line:hover{ background:#FFFFFF; border-color:var(--ink); transform:translateY(-1px); }

/* Direct track search box */
.track-box{
  display:flex; gap:.6rem; margin-top:1.2rem; flex-wrap:wrap;
}
.track-input{
  flex:1; min-width:200px; padding:.85rem 1.2rem; border-radius:999px;
  border:1px solid var(--line); background:#FFFFFF; font-family:var(--f-mono);
  font-size:.82rem; color:var(--ink); outline:none; transition:border-color .2s;
}
.track-input:focus{ border-color:var(--ink); }
.track-go{
  background:var(--ink); color:#FFFFFF; border:none; border-radius:999px;
  padding:.85rem 1.6rem; font-family:var(--f-mono); font-size:.7rem;
  letter-spacing:.12em; text-transform:uppercase; font-weight:700;
}

.note{ font-family:var(--f-mono); font-size:.66rem; letter-spacing:.06em; color:var(--muted); margin-top:2rem; text-align:center; }
.note a{ color:var(--ink); font-weight:700; text-decoration:underline; }
</style>
<script src="js/transitions.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/layout-fix.css">
</head>
<body>
<header id="hd"><div class="nav"><a href="index.html" class="logo">THE AIM<b>.</b></a><span data-account style="margin-left:auto"></span></div></header>
<div class="wrap" id="page"></div>

<script src="js/products-data.js"></script>
<script>
(function(){
  var fmt = function(n){ return '₹' + Number(n).toLocaleString('en-IN'); };
  var page = document.getElementById('page');
  var params = new URLSearchParams(window.location.search);
  var qId = params.get('id');

  var order = null;
  try{
    var raw = localStorage.getItem('ascentra_last_order');
    if(raw) order = JSON.parse(raw);
  }catch(e){}

  // If query id matches or order not loaded, check order list
  if(!order && qId){
    try{
      var all = JSON.parse(localStorage.getItem('ascentra_orders')||'[]');
      order = all.find(function(o){ return o.id === qId; });
    }catch(e){}
    if(!order){
      order = { id: qId, customer: {}, items: [], total: 0, payment: 'online', status: 'confirmed' };
    }
  }

  var waPhone = '919173144344';
  var ordId = order ? order.id : (qId || '');
  var waMessage = ordId
    ? ('Hi THE AIM, I placed order ' + ordId + '. Please send me my order tracking and dispatch updates!')
    : 'Hi THE AIM, I would like to track my order updates on WhatsApp.';
  var waUrl = 'https://wa.me/' + waPhone + '?text=' + encodeURIComponent(waMessage);

  if(!order){
    page.innerHTML =
      '<div class="tick-wrap">' +
        '<div class="tick">✓</div>' +
        '<div>' +
          '<div class="badge-confirmed"><span class="badge-dot"></span> Order Received</div>' +
          '<h1 style="margin-top:.4rem">Thank you</h1>' +
        '</div>' +
      '</div>' +
      '<p class="lead">Your order has been placed and registered in our system.</p>' +

      '<div class="wa-card">' +
        '<div class="wa-left">' +
          '<div class="wa-icon">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
          '</div>' +
          '<div>' +
            '<div class="wa-title">Get Live Tracking on WhatsApp</div>' +
            '<div class="wa-sub">Get direct dispatch & courier tracking updates sent straight to your WhatsApp.</div>' +
          '</div>' +
        '</div>' +
        '<a href="' + waUrl + '" target="_blank" rel="noopener" class="wa-btn">Track on WhatsApp →</a>' +
      '</div>' +

      '<div class="card">' +
        '<h2>Track Your Order Online</h2>' +
        '<p style="font-size:.9rem;color:var(--muted)">Enter your order ID (e.g. AIM...) below to see live fulfillment and courier delivery status anytime:</p>' +
        '<form class="track-box" onsubmit="event.preventDefault(); var v=document.getElementById(\'tIn\').value.trim(); if(v) window.location.href=\'track.html?id=\'+encodeURIComponent(v);">' +
          '<input type="text" id="tIn" class="track-input" placeholder="Enter your Order ID" required />' +
          '<button type="submit" class="track-go">Track Order →</button>' +
        '</form>' +
      '</div>' +

      '<div class="cta">' +
        '<a href="shop.html" class="btn btn-solid">Continue shopping</a>' +
        '<a href="track.html" class="btn btn-line">Go to Track Page</a>' +
      '</div>' +
      '<p class="note">You can track your order anytime at <a href="track.html">Track Order</a></p>';
    return;
  }

  var c = order.customer || {};
  var lines = Array.isArray(order.items) ? order.items : [];
  var payLabel = order.payment === 'cod' ? 'Cash on Delivery' :
                 order.status === 'paid' ? 'Paid online' : 'Online payment';

  try{
    page.innerHTML =
      '<div class="tick-wrap">' +
        '<div class="tick">✓</div>' +
        '<div>' +
          '<div class="badge-confirmed"><span class="badge-dot"></span> Order Confirmed</div>' +
          '<h1 style="margin-top:.4rem">Thank you' + (c.name ? ', ' + c.name.split(' ')[0] : '') + '</h1>' +
        '</div>' +
      '</div>' +
      '<p class="lead">We\'ve got your order and our team is already preparing it for packing.</p>' +

      '<div class="ord-bar">' +
        '<div class="ord-id">Order #' + order.id + '</div>' +
        '<button class="copy-btn" id="copyOrd" onclick="navigator.clipboard.writeText(\'' + order.id + '\'); this.textContent=\'COPIED ✓\'; setTimeout(()=>{this.textContent=\'COPY ID\'},2000)">COPY ID</button>' +
      '</div>' +

      /* Direct WhatsApp Live Tracking Card */
      '<div class="wa-card">' +
        '<div class="wa-left">' +
          '<div class="wa-icon">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
          '</div>' +
          '<div>' +
            '<div class="wa-title">Get Live Tracking on WhatsApp</div>' +
            '<div class="wa-sub">Tap below to receive dispatch alerts and live tracking updates on your phone.</div>' +
          '</div>' +
        '</div>' +
        '<a href="' + waUrl + '" target="_blank" rel="noopener" class="wa-btn">Track on WhatsApp →</a>' +
      '</div>' +

      '<div class="card"><h2>What happens next</h2><div class="steps">' +
        '<div class="step"><span class="n">1</span><div><b>Order confirmed</b> — your order is safely logged and sent to fulfillment.</div></div>' +
        '<div class="step"><span class="n">2</span><div><b>Packed & shipped</b> — dispatched within 24 hours with live courier tracking.</div></div>' +
        '<div class="step"><span class="n">3</span><div><b>Fast Delivery</b> — ' + payLabel + (order.payment==='cod'?' — please keep cash ready at delivery.':'.') + '</div></div>' +
      '</div></div>' +

      (lines.length ?
        ('<div class="card"><h2>Order summary</h2>' +
          lines.map(function(i){
            var p = (typeof PRODUCTS !== 'undefined') ? PRODUCTS.find(function(x){ return x.id === i.id; }) : null;
            var imgUrl = p ? (p.thumb || p.hero) : (i.image || '');
            return '<div class="o-row">' +
              (imgUrl ? '<img src="' + imgUrl + '" alt="" />' : '<div style="width:52px;height:52px;background:var(--swan-2);border-radius:10px"></div>') +
              '<div><div class="o-nm">' + (i.name || 'Item') + '</div><div class="o-q">Qty ' + (i.qty || 1) + '</div></div>' +
              '<div class="o-pr">' + fmt(i.line != null ? i.line : (i.price || 0) * (i.qty || 1)) + '</div></div>';
          }).join('') +
          '<div class="o-total"><span>Total (' + payLabel + ')</span><span>' + fmt(order.total) + '</span></div>' +
        '</div>') : '') +

      (c.address
        ? '<div class="card"><h2>Delivering to</h2><p class="addr">' +
            '<b>' + (c.name || '') + '</b><br/>' + c.address + '<br/>' +
            (c.landmark ? c.landmark + '<br/>' : '') +
            [c.city, c.state].filter(Boolean).join(', ') + (c.pincode ? ' — ' + c.pincode : '') + '<br/>' +
            (c.phone ? 'Phone: ' + c.phone : '') + '</p></div>'
        : '') +

      '<div class="cta">' +
        '<a href="track.html?id=' + encodeURIComponent(order.id) + '" class="btn btn-solid">Track Order Online →</a>' +
        '<a href="shop.html" class="btn btn-line">Continue shopping</a>' +
      '</div>' +
      '<p class="note">Track this order anytime at <a href="track.html?id=' + encodeURIComponent(order.id) + '">theaimsite.netlify.app/track</a></p>';
  }catch(e){
    console.error('Error rendering order confirmation', e);
    page.innerHTML =
      '<div class="tick-wrap"><div class="tick">✓</div><div><h1>Order confirmed</h1></div></div>' +
      '<p class="lead">Thank you. We\'ve got your order' + (order.id ? ' (' + order.id + ')' : '') + ' and we\'re on it.</p>' +
      '<div class="wa-card">' +
        '<a href="' + waUrl + '" target="_blank" rel="noopener" class="wa-btn">Get Updates on WhatsApp →</a>' +
      '</div>' +
      '<div class="cta"><a href="shop.html" class="btn btn-solid">Continue shopping</a>' +
      '<a href="track.html" class="btn btn-line">Track order</a></div>';
  }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ascentra-db.js"></script>
<script src="js/account.js"></script>
<script src="js/support.js"></script>
</body>
</html>
